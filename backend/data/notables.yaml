# Real notable lawyers at the January 2005 start (ADR PT-0013: real lawyers by name,
# personal use only). PT-M5 sub-task 1a.
#
# Sources: docs/research/notables-2005.md (the 2005 dossier) and its "Gaps closed (PT-M5
# sub-task 1a, 2026-11-20)" section, which overrides the dossier where they differ (keep /
# DROP / ADD decisions, career_start, status by 2025, normalised moves 2005-2015, and the [S]
# source for each 2005 role). DROP rows are not listed.
#
# Tags in `src`: S = sourced (a page states it), D = derived from sourced facts, A = assumed
# (basis given). `src` holds the [S] source for the 2005 role first, then the career-start
# and end-of-practice tags with short source names.
#
# Rules (ADR PT-0013):
#   - Professional standing only: firm, practice, 2005 role, standing and dated professional
#     moves. Nothing about private life, health, age, birth date, politics, misconduct or
#     controversy is recorded here, and no cause is ever given for a departure.
#   - left_practice is a year with no cause (any reason; government, bench or in-house with
#     no return counts). Omitted when the person still practised in 2025 or no year was
#     found: the engine then retires them by age (rivals.retire_age, from career_start).
#   - Skills come from `standing` at game creation (balance.yaml rivals.standing_ca), with
#     seeded noise; personality and hidden traits use the neutral distribution.
#   - moves: dated events 2005-02..2015-12 (kind: lateral, government, judiciary, in_house,
#     chair_role, of_counsel, left_practice). `to` only for a lateral whose destination is a
#     firms.yaml key. Firm mergers and absorptions are firms.yaml events, not moves here.
#   - Fields: key (firm__name), firm (firms.yaml key), practice (practices.yaml key), level
#     (equity_partner | income_partner | counsel), standing (elite | leading | strong), chair
#     (the firm's chair, managing partner or CEO in January 2005), career_start (law school
#     graduation or bar admission year).

