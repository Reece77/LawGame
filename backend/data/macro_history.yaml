# The macro and legal indices, 2005-2015 (PT-M7; spec 6 demand, spec 14). Each index is 1.0 at
# the 2005 average. Points are dated months; a month between two points is interpolated, a
# month after the last holds it (seeded cycles to 2034 are PT-M10's). Mid-year points carry
# each year's annual figure; the October 2008 and April 2009 points carry the crash's timing
# (Lehman, 15 September 2008; the trough in the spring of 2009).
#
# Source tags as in docs/research/v1-market.md: [S] seen in the source, [D] derived, [A] assumed.
# The dossier with every figure and its source: docs/research/v1-macro.md. Volume indices are
# damped (about the square root of the dollar volume's ratio, [D/A]): legal work follows deal
# counts and hours more than deal values (dossier s2).
#
# How the indices act is in balance.yaml `macro:` and ptk/sim/macro.py.

sources:
  growth: "[A] dossier s2: large-firm demand (hours) growth, Citi/Peer Monitor, net of the cycle the driver indices carry"
  ma: "[D] dossier s2: US announced M&A value, damped"
  pe: "[D] dossier s2: US buyout value, damped"
  issuance: "[D] dossier s2: US IPO count and debt issuance, blended"
  lending: "[D] dossier s2: US leveraged loan issuance, damped"
  credit: "[D] dossier s2: square root of 2005's speculative-grade default rate over the year's (Moody's)"
  cycle: "[A] dossier s2: real activity (GDP and corporate profits) relative to 2005"
  enforcement: "[D] dossier s2: SEC enforcement actions and DOJ FCPA actions"
  ip: "[D] dossier s2: patent suits filed, damped"
  real_estate: "[D] dossier s2: US commercial property transaction volume, damped"
  lateral_heat: "[D/A] dossier s2: lateral partner moves (Am Law Lateral Report) and associate hiring"
  collections: "[A] dossier s2: lockup and days to pay (Citi Private Bank Law Firm Group)"

points:
