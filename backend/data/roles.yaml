    secondary: [writing, project_management, technical]
    work_style: operator
    work_style_weights: { builder: 4, operator: 5, researcher: 1, seller: 1 }
    interest_weights: { climate: 4, mining: 2 }

  - key: technology_privacy
    label: Technology and privacy lawyer
    kind: lawyer
    practice: technology_privacy
    summary: "Drafts technology deals and runs privacy programmes and breach responses."
