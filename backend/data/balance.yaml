    guarantee_weight: 0.8
    realised_sd_bp: 2000 # realised portability = hidden portability +- N(0, this), clamped 0-10000
    arrival_months: [12, 24] # the book arrives over this many months, uniform
    start_relationship: [40, 60] # 0-100: a following client's starting relationship
  election: # ADR PT-0007 3
    stage: 2 # the MP's term starts when the firm reaches this stage
    rival_ambition_min: 12 # partners with ambition at least this may stand against the MP
  stages: [1, 4, 21, 101, 401, 1501] # lawyers at which stages 0-5 begin (spec 3)
  cfo_warning_cooldown: 3 # months between the CFO's warnings
staffing: # PT-M7a: the default rule plans each member's hours for their expected output (ptk/sim/matters/staffing.py)
  output_floor: 0.3 # expected output an hour (effective skill / 10 x strain factor) is never planned below this
  output_cap: 1.3 # nor above this (a strong team still gets enough hours to absorb rework)
  plan_fill: 0.95 # the rule plans a person's named hours up to this share of monthly capacity (headroom against strain; PT-M3a planned to 1.0)
  policy_min_hours: 1500 # PT-M7b: the hours policy's floor, billable hours a year (firm-wide)
  policy_max_hours: 2600 # PT-M7b: and its ceiling
  policy_fill_max: 1.2 # PT-M7b: a policy above plan_fill plans (and fills flow) up to policy / capacity, never above this share of capacity
pro_bono: # PT-M7a, spec 7.8: work with no fees
  credit_hours: 50 # the default credit policy: pro bono hours a year that count toward a lawyer's billable target
  credit_max_hours: 300 # the most the policy may credit, hours a year
  uncredited_hours: 12 # pro bono hours a lawyer takes on a year with no credit at all
  uptake: 1.0 # extra pro bono hours a year per credited hour (the firm's pool: (uncredited + uptake x credit) / 12 per lawyer a month)
  flow_fill: 0.9 # pro bono flow fills free capacity up to this share of monthly capacity (as matters.flow_fill)
  named_bp_per_lawyer: 50 # bp a month per lawyer that a named pro bono matter arrives (50 lawyers: one every 4 months)
  named_hours: [150, 600] # hours a named pro bono matter needs, uniform
  named_months: [4, 12] # its planned months, uniform inclusive
  named_kinds: # what named pro bono work is; kind is the practice's matter kind it runs as
