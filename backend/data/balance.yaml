    - { practice: commercial_litigation, kind: dispute_advice, label: "asylum application", weight: 0.3 }
    - { practice: employment, kind: employment_litigation, label: "workers' rights case", weight: 0.15 }
    - { practice: corporate_ma, kind: governance, label: "advice to a charity", weight: 0.15 }
  morale_full_hours: 8 # pro bono hours in a month at which the morale term is full
  morale_max: 3.0 # morale target points at full pro bono hours (real responsibility early)
  morale_levels: [associate_1, associate_2, associate_3, associate_4, associate_5, associate_6, associate_7, associate_8] # who the morale term applies to
  appeal_per_hour: 0.004 # offer score per pro bono hour a lawyer a year (recruiting appeal); 60 hours: +0.24
  appeal_max: 0.4 # offer score at most from pro bono
  average_rate: 0.0833 # the firm's pro bono hours per lawyer is a moving average: this share of the gap closed a month (a year's memory)
