  ewyk: { origination: 0.50, working: 0.35, management: 0.15 } # spec 8.5: shares of each credit
  committee: { origination: 0.4, adjust_max_bp: 3000 } # spec 8.5: origination weight; the most the player moves a share in the comp round (bp of it)
  management_credit: { mp: 1.0, unit_leader: 0.5 } # management credit units (EWYK, contribution)
  satisfaction: # spec 8.5: share against contribution and market value
    ego_weight: 0.04 # relative contribution a partner believes they made, per ego point above 10
    floor: -1.0 # satisfaction clamp
    ceiling: 0.5
  budget: # each equity partner's budgeted share, which their draws follow (ADR PT-0003 6)
    first_year_margin_bp: 3000 # bp of the founding partners' books the first year's profit is budgeted at
  capital:
    pay_in_months: 36 # a new equity partner pays capital in over this many months (ADR PT-0003 5)
    return_months: 36 # a departed partner's capital is returned over this many months
  reforecast_months: [3, 6, 9] # calendar months in which budgets (and so draws) are cut to the trailing-12-month profit's run rate, never raised
  true_up_months: [1, 2, 3, 4] # calendar months in which December's true-up is paid, as cash allows
  cash_buffer_months: 1.0 # months of costs the firm keeps before paying the true-up or repaying the revolver
  revolver: # spec 8.4, TST 20.3's lender pattern
    receivables_bp: 7000 # borrowing base: bp of receivables
    wip_bp: 4000 # borrowing base: bp of unbilled WIP
    unsecured_bp: 5000 # the bank lends up to this share of the facility whatever the base (the partners' personal guarantees)
    facility_of_revenue_bp: 2500 # each January the facility is reset to this share of last year's revenue (floored at the scenario's limit)
    rate_bp: 650 # annual interest, bp (prime plus a spread, 2005) (6800)
    leverage_max_bp: 3000 # covenant: drawn at most this share of trailing-12-month revenue
    min_capital_bp: 5000 # covenant: partners' capital at least this share of the drawn balance
    departures_max_bp: 2000 # covenant: departed partners' books (12 months) at most this share of revenue
    cure_months: 3 # consecutive months in breach before the bank calls the revolver
    call_months: 3 # months the bank gives to repay a called revolver
    warning_headroom_bp: 2000 # the CFO warns when any covenant is within this share of its limit
    forecast_months: 6 # PT-M7b: months ahead the CFO projects the covenants (the forecast warning, spec 8.7)
    forecast_window: 6 # PT-M7b: trailing months of revenue, cash, drawn balance and capital the trend is fitted on
  insolvency_months: 3 # consecutive month ends with cash below zero after the revolver before the firm dissolves (TST 14.7)
  dissolve_vote_months: 2 # consecutive month ends below zero before restless partners can vote to dissolve
  dissolve_restless_bp: 5000 # bp of equity partners restless (confidence below restless) for a stricken firm to vote to dissolve
  confidence: # ADR PT-0007 1, TST 14.6's rule B <- B + rate (T - B)
