    rate: 0.2
    target_base: 55
    pep_weight: 20 # points for a partner's satisfaction from -1 to +1
    trend_weight: 10 # points for the firm's PEP run rate against last year's, -100% to +100%
    mp_weight: 8 # points for the MP's leadership and communication from 1 to 20 (centred on 10)
    draws_suspended: -12 # points while draws are below the agreement's share
    bank_trouble: -10 # points while a covenant is breached or the revolver is called
    departure_hit: -4 # points per equity partner departure in the last 12 months
    comp_step: 4 # one-off points per lockstep step a partner is moved in the comp round (held: negative)
    deequity_fear: 10 # one-off points lost by partners whose PEP contribution is below the median, at a de-equitisation
    supportive: 60 # whip count: at or above
    restless: 40 # whip count: below
    range_half_width: 8 # a partner's confidence is shown as a band this many points either side
    petition_below: 30 # average confidence below this for petition_months brings a no-confidence petition (ADR PT-0007 3)
    petition_months: 6
  votes: # ADR PT-0007 2; spec 5.5's utility
    noise_sd: 0.5 # utility points of noise per partner per vote (stream vote)
    confidence_weight: 1.0 # utility per (confidence - 50) / 50
    lobby_points: 0.6 # utility a lobbying conversation adds
    promise_per_point: 0.25 # utility per promised lockstep point
    predict_k: 1.0 # a vote's predicted range counts partners within this many utility points of 0 as either way
