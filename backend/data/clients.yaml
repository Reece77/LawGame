# The client universe (spec 7.1, 7.3; PT-M3a). Real clients and the sectors that shape every
# client's legal wallet. Append-only: client ids follow this file's order, then the generated
# clients (stream client_gen, ADR PT-0012), so editing earlier rows changes every save.
#
# Wallets: a client's weight in practice p is size x sector intensity x the sector's practice
# mix, where size = revenue_bn ^ clients.size_exponent (balance.yaml). Each month the market's
# demand in p (practices.yaml) is split over all clients by weight, so wallets always sum to
# the market. All sector numbers are [A] (no source found; shaped on the F&J 2006 litigation
# share of 58% [S] via docs/research/v1-market.md s2 and on each industry's deal and dispute
# profile). Mix weights need not sum to 1; they are normalised per practice across clients.

sectors:
  - key: banking
    label: Banks and brokers
    intensity: 2.0
    mix: { corporate_ma: 0.10, private_equity: 0.05, capital_markets: 0.25, banking_finance: 0.25, restructuring: 0.05, commercial_litigation: 0.15, white_collar: 0.10, ip: 0.0, employment: 0.03, real_estate: 0.02 }
    suffixes: [Bancorp, Financial, Capital, Trust]
  - key: insurance
