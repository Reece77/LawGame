  ndcal: us_ca
  edtex: us_tx
  wdtex: us_tx
  aaa: null
  icc: null
  ew_commercial: ew
  lcia: null

# The London trainee and associate scale (spec 5.2, 5.4; dossier s3): Magic Circle trainees'
# salaries a year (first, second year) in 2005-dollar cents at the year's GBP/USD, and London
# associates' pay as bp of the New York scale's class year (NQ = class 1). Rows change each May
# with the firms' announcements; after 2025 the last row holds against New York's seeded scale.
london_scale:
