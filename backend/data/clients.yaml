    intensity: 1.0
    mix: { corporate_ma: 0.10, private_equity: 0.0, capital_markets: 0.10, banking_finance: 0.05, restructuring: 0.05, commercial_litigation: 0.35, white_collar: 0.10, ip: 0.0, employment: 0.10, real_estate: 0.15 }
