  centre_share: 0.6 # the range's centre is within this share of the half-width of the true merits (uniform), so the range always holds them
rates: # PT-M7a: the firm's yearly rate rise over the practices' 2005 cards; the market's is macro_history.yaml rate_rise (PT-M7), then rivals.rate_inflation
  rise_min_bp: -1000 # the policy may cut rates up to 10% a year
  rise_max_bp: 2000 # or raise them up to 20%
  month: 1 # calendar month the rise takes effect (January)
  card: # PT-M7b: a new firm's card by practice, a share of the top 2005 card (practices.yaml), times the rate index
    start_bp: 8000 # bp: a new firm starts every practice at this share of the top card; PT-M7c (client tiers): what large clients pay a new firm, 9850 -> 8000 (the founders' book keeps 9850); PT-M7b tuning 6500 -> 9850 (T5: at 6500 steady dissolved on 9 of 10 seeds in its first year, 8500: 4, 9000: 3, 9500: 1; PT-M4's exodus guard: 3 of 10 heeded firms dissolved at 9500, 2 at 9750, 1 at 9850)
    step_bp: 400 # bp: the most a practice's share moves toward its target each January (a reputation is earned over years); PT-M7b tuning 250 -> 50; PT-M7c 50 -> 400 (with an 80% start, a top-decile firm reaches the full card in five years)
    # PT-M7c (Reece, 2026-11-23): client tiers. The practice's share (start_bp, moving with reputation) is what large clients pay; only a top-decile firm reaches the full card
    mid_max_bp: 6000 # bp of the top card a mid-market client pays at most (Reece: 55-60%; the Second Hundred's partners billed $650 against the Am Law 100's $875 and a top card of about $1,090 in 2015, docs/research/firm-economics.md s11)
    book_months: 24 # months from the founding the book clients keep the founders' rates (Reece: "so the first two years survive"); then they pay their tier's card
    book_fade_months: 60 # then months over which a book client's share falls linearly to its tier's card (a cliff at month 24 cut 2007's profit below zero, zero allocations sent every partner's flight to its cap and steady dissolved on 7 of 10 seeds)
    book_bp: 9850 # bp of the top card the founders' book clients keep (their portable relationships came at the founders' BigLaw rates; PT-M7b's start)
macro: # PT-M7: how macro_history.yaml's indices act on the firm (ptk/sim/macro.py; spec 6, 14)
  beta_scale: 1.3 # multiplier on every practice's demand beta (T8's tuning key); PT-M7 tuning 1.0 -> 1.3 (T1, T8)
  demand_floor: 0.25 # a practice's driver term never falls below 25% of its base
  collections_weight: 1.0 # days to pay x (1 + w (collections index - 1))
  lateral_heat_weight: 1.0 # associate resignations and partners' market value x (1 + w (heat - 1))
  estate_mult: 15.0 # PT-M7b tuning 25 -> 15 (T8 restructuring); a bankrupt real client's restructuring wallet weight x this while its estate runs
  estate_months: 24 # months a bankrupt client's estate instructs restructuring work, then its wallet ends
  rescue_months: 3 # months a rescued client's wallet runs on after the rescue (the deal closing), then ends
  crisis: # PT-M7b (spec 14: 2008-2009 "rates frozen; clients demand discounts"): ptk/sim/macro.py crisis_stress
    collections_from: 1.05 # collections index: stress starts above this (2008's July point)
    collections_full: 1.20 # and is 1 here (the April 2009 trough)
    credit_from: 0.80 # credit index: stress starts below this
    credit_full: 0.35 # and is 1 here
    sector_weight: 1.0 # a client's factor x (1 + w x its sector's shortfall: its mix-weighted pro-cyclical indices below 1)
    sensitivity_neutral: 10.0 # 1-20: price sensitivity at which a client's factor is 1 (factor = sensitivity / this)
    discount_bp: 1000 # bp off a new engagement (and a month's flow bill) at stress 1, factor 1; PT-M7b tuning 1200 -> 1000 (T8 corporate -10.8%; at 1200 with collapses, pyramid and steady died in the crash)
    discount_max_bp: 2500 # bp: the most a crisis discount reaches
    ask_bp: 2500 # bp: a bill's chance of a write-down request at stress 1, factor 1 (stream crisis); PT-M7b tuning 3000 -> 2500
    writedown_bp: [500, 2000] # bp of the bill a request writes down, uniform
    collapse_month_bp: 300 # bp a month: an open deal's collapse chance per unit of its driver's shortfall below 1 (stream deal_collapse); PT-M7b tuning 2500 -> 300 (at 1250-2500 pyramid and steady died in the crash on most seeds)
    close_k: 0.3 # logit points off a deal's p_close per unit of its driver's shortfall below 1; PT-M7b tuning 2.0 -> 0.3
  seeded: # PT-M10: the seeded world after history (ptk/sim/macro_seed.py; ADR PT-0015); streams macro_seed 65, scale_seed 66
    start: [2026, 1] # the first seeded month: history (macro_history.yaml, salary_scale.yaml) is pinned through December 2025 (ADR PT-0002 2)
    until: [2034, 12] # the last seeded month (the standard campaign's end)
    fit_years: [2005, 2025] # each index's AR(1) is fitted to its July values over these years
    mean_years: [2016, 2025] # a mean-reverting index reverts to its mean log level over these years
    trend_series: [growth] # these revert to their fitted 2005-2025 log trend instead (long-run growth G keeps growing)
    phi_range: [0.0, 0.9] # the fitted annual AR(1) coefficient is held in this range (a unit root would wander off)
    noise_scale: 1.0 # multiplier on each fitted residual spread (1: history's)
    episodes: # history's recessions, from the start of the fall to the trough; a seeded recession replays one of them
      - { from: [2008, 7], trough: [2009, 4] } # the financial crisis
      - { from: [2020, 2], trough: [2020, 4] } # the pandemic shock
    recession_hazard_scale: 1.0 # multiplier on history's frequency (episodes / months fitted: 2 in 252)
    recession_gap_months: 36 # months: the least time from one recession's start to the next's
    rate_range: [0.0, 0.09] # a seeded January rate rise is held in this range (fraction)
    scale: # the salary scale's seeded steps: the market leader raises when lateral heat and profits run hot
      month: 6 # steps take effect in June (2016, 2018 and 2021's did)
      heat_from: 1.1 # lateral heat index, the past 12 months' mean, at least this
      rate_from: 0.04 # and the year's rate rise (the profits proxy) at least this
      min_gap_years: 2 # years since the last step (2016 to 2018 was the shortest gap in history)
      chance_bp: 5000 # bp: chance a hot year brings a step
      step_years_from: 2016 # history's first-year steps from 2016 on are the step sizes drawn
      fallback_step: 0.07 # the step when history gives none
