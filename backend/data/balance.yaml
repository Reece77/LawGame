    contagion: 3.0 # c: x departed_12m / group size
    confidence_ref: 50 # (1 + max(0, ref - conf) / confidence_divisor)
    confidence_divisor: 25
    lockstep_star_mult: 1.3 # star poachability under pure lockstep (spec 8.5)
    star_book_mult: 2.0 # a star: a book above this many times the firm's median partner book
    cap_bp: 1500 # the most p_leave reaches a month
    market_multiple_bp: 4500 # V_mkt = book x this (the lateral market's multiple, constant until PT-M7)
    min_book_cents: 50000000 # a partner's book is at least this ($500,000) for V_mkt
    answer_months: 1 # months the firm has to counter an approach
    guarantee_years: [0, 2] # years the suitor guarantees, uniform
    offer_mult: [1.0, 1.3] # the suitor offers V_mkt x U(range)
    stay_base: 0.5 # logit of staying before the comp gap
    stay_gap_weight: 5.0 # logit per (firm comp with counter - offer) / offer
    stay_loyalty: 0.15 # logit per loyalty point above 10
    stay_confidence: 0.03 # logit per confidence point above 50
    seat_bonus: 0.5 # logit for a seat in the counter
    guarantee_value: 0.4 # logit per guaranteed year in the counter
    stay_hint_bands: { lo: 0.35, hi: 0.65 } # likely to go below lo, likely to stay above hi
    follow_months: [0, 9] # months after leaving that each portable client follows, uniform
    orphan_drop: 10 # relationship points lost by a client whose partner left without it
  lateral: # spec 5.7: lateral partners
    batch: [1, 3] # candidates per lateral partner search
    search_cost_cents: 2500000 # $25,000 recruiter retainer (6200)
    fee_bp: 2500 # bp of first-year comp paid to the recruiter on hire (6200)
    book_cents: [100000000, 600000000] # a lateral partner's book a year, log-uniform ($1M-$6M)
    book_range_bp: 5000 # the book is shown within +-this share before diligence
    diligence_range_bp: 1500 # and +-this after
    diligence_cost_cents: 2000000 # $20,000 of professional fees (6600)
    comp_of_book_bp: 2500 # their comp demand: bp of their book; PT-M7b tuning 3500 -> 2500 (T9: the rocket dissolved on 8 of 10 seeds at 3500, its guarantees ate the book before it arrived)
    notice_premium_bp: 300 # bp more demand per month of the agreement's notice period
    guarantee_years: [0, 3] # years of guarantee they ask for, uniform
    shelf_turns: 3 # months a lateral candidate stays open
    accept_k: 6.0 # acceptance logistic: k x (offer / ask - 1) + guarantee_weight x (years offered - asked) + base
