# Legal technology eras (PT-M14; spec 13; ADR PT-0011 2). Source: docs/research/legal-tech.md
# (s1 milestones, s2 adoption, s3 savings, s7 costs, s8 proposals). Tags: [S] seen, [D] derived,
# [A] approximate (as the dossier's).
#
# Each era:
#   start: the first month a firm can adopt it (s1).
#   tasks: the era's strength on each task at strength 1.0, 0-1. The engine's efficiency is
#     1 - exposure x strength x adoption (practices.yaml ai_exposure), so a task's weight here is
#     the dossier s8's "share of hours removed" / (the task's exposure x the era's 2025
#     strength) [D], capped at 1.
#   strength: the era's strength over time, 0-1, dated to December 2025 (linear between points).
#   strength_seeded: after December 2025, linear from December 2025's value to U(lo, hi) at `by`
#     (stream tech_seed, 110: each save its own world; ADR PT-0002 2).
#   market: the large-firm market's average adoption, 0-1 (s8's adoption table) [D/A], then
#     market_seeded as strength_seeded.
#   platform_cents: a one-off platform cost (capex to 1500, amortised to 6100) [A: no published
#     platform prices; s7]. subscription_cents: per lawyer a month at full coverage (6100).
history_end: [2025, 12]
sources:
  dossier: docs/research/legal-tech.md
eras:
  - key: ediscovery
    label: E-discovery platforms
    start: [2005, 1]
    tasks: { review: 0.11, diligence: 0.07, management: 0.17 } # [D] s8 0.10/0.9, 0.05/0.7, 0.05/0.3
    strength:
      - { ym: [2005, 1], value: 0.5, src: "[A] s1: platforms before the December 2006 FRCP amendments" }
      - { ym: [2007, 1], value: 1.0, src: "[S] s1: FRCP e-discovery amendments, 1 Dec 2006" }
    market:
      - { ym: [2005, 1], value: 0.30, src: "[A] s8 (no adoption survey found)" }
      - { ym: [2007, 1], value: 0.65, src: "[A] s8" }
      - { ym: [2010, 1], value: 0.90, src: "[A] s8" }
      - { ym: [2012, 1], value: 0.95, src: "[A] s8" }
    platform_cents: 10000000 # $100k [A]
    subscription_cents: 15000 # $150 a lawyer a month [A]
  - key: offshore
