# Cities a firm may open an office in (PT-M11; spec 8.8). Sources and tags: docs/research/
# london-and-us-cities.md (s7 the US cities against New York, s1-s3 London). S sourced, D derived,
# A assumed (basis in the dossier).
#
#   region: the macro and reputation region (us, uk). jurisdiction: bar_rules.yaml key where a
#     lawyer must be admitted to lead the office's matters.
#   demand: the city's large-firm market x New York's D0 (practices.yaml), by practice x `mix`
#     (1.0 where a practice is not listed); its clients split it by wallet, like New York's.
#   rate_bp: the local rate card as bp of the firm's card. pay_bp: local salary bands as bp of
#     New York's (London associates and trainees: bar_rules.yaml london_scale).
#   rent_per_seat_cents: a lease's monthly rent per lawyer seat (space for the lawyer and their
#     share of support staff), 2005 dollars.
#   clients: generated local clients made when a firm first opens in the city (stream
#     city_clients, id 100); London also has its real clients (clients.yaml uk_clients).
#   aliases: firms.yaml hq keys that mean the same city (a rival's region).
cities:
  - key: new_york
    label: New York
    region: us
    jurisdiction: us_ny
    demand: 1.0
    rate_bp: 10000
    pay_bp: 10000
    rent_per_seat_cents: 400000 # $4,000 [A] dossier s7: Class A Midtown ~$60/sq ft x ~800 sq ft a lawyer
    aliases: [armonk]
    src: "home market (v1)"
  - key: washington_dc
    label: Washington, D.C.
    region: us
    jurisdiction: us_dc
    demand: 0.40 # [A] dossier s7: DC's large-firm lawyers about 40% of New York's
    mix: { white_collar: 2.0, commercial_litigation: 1.1, ip: 1.2, employment: 1.0, corporate_ma: 0.6, private_equity: 0.4, capital_markets: 0.4, banking_finance: 0.5, restructuring: 0.5, real_estate: 0.8, international_arbitration: 1.2, tax: 1.2, antitrust: 2.5, financial_regulation: 2.0, healthcare: 2.5, energy: 1.5, technology_privacy: 1.5, private_client: 0.6, insurance: 0.6, mass_torts: 0.6 } # PT-M12: the v2 practices [A] docs/research/practices-v2.md s7
    rate_bp: 9000 # [A] dossier s7
    pay_bp: 9000 # balance.yaml pay.city_bp washington_dc
    rent_per_seat_cents: 340000 # [A] dossier s7
    clients: 20
    aliases: [washington]
    src: "[A] dossier s7"
