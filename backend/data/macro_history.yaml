# PT-M10: dated shocks the indices cannot carry (ptk/sim/macro.py shock_share; ADR PT-0015 5).
# The pandemic: courts closed and deals paused in April-May 2020 (history-2016-2025 s2's
# narrative: jury trials suspended from mid-March, US M&A -85% in Q2, industry demand -5.9% in
# Q2 [S]); the shares are [A], tuned to the brief's 10-30% fall of a corporate-heavy firm.
shocks:
  - from: [2020, 4]
    months: 2
    demand: { commercial_litigation: 0.35, white_collar: 0.25, employment: 0.15, ip: 0.20 }
    hours: { commercial_litigation: 0.15, white_collar: 0.10, ip: 0.10, employment: 0.05 } # PT-M10 tuning: courts' hearings adjourned; deals' hours not paused (the ma and pe indices' April-May 2020 trough carries the deal drop): with deals at 0.30 T8.2020 read -41.1%, at 0.15 -35.8% (seeds 1-10)
    docket: true
    src: "history-2016-2025 s2 (the pandemic's shape): lockdowns from mid-March 2020, courts' trials suspended, deals paused; shares [A]"

