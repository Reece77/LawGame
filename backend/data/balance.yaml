    failure_bp: 150 # monthly hazard while the boutique's profit is negative
    growth_bias: { lo: -0.02, hi: 0.15 } # demand growth a year beside the market, uniform
    max_alive: 40
  generated: # spec 10.1: generated regional and mid-market firms
    count: 120
    revenue_cents: { lo: 3000000000, hi: 40000000000 } # $30M-$400M FY2005
