# The associate salary scale and year-end bonuses (spec 5.4; PT-M1b). Money is integer cents
# a year, nominal USD, at top New York firms (the market a firm matches, lags or leads).
#
# History (dossier): first-year salary $125,000 in 2005 and $160,000 from 2007 are the spec's
# figures; the 2006 row and the class steps of every row are approximate (a design default
# to be checked against the salary dossier when it lands, see the brief's follow-ups). v1
# carries history to 2015; the last row holds until PT-M7's seeded macro moves it.
#
# scale: one row per market change, effective from `from` [year, month]; `salaries` by class
# year 1-8 (associate_1..associate_8; senior_associate is paid as class 8).
scale:
  - { from: [2005, 1], salaries: [12500000, 13500000, 15000000, 17000000, 19000000, 20500000, 21500000, 22000000] }
  - { from: [2006, 1], salaries: [14500000, 15500000, 17000000, 19000000, 21000000, 22500000, 23500000, 24500000] }
  - { from: [2007, 1], salaries: [16000000, 17000000, 18500000, 21000000, 23000000, 25000000, 26500000, 28000000] }
# bonuses: the market's year-end bonus paid in December of `year`, by class year 1-8
# (approximate; 2008-2010 show the crisis cut). A year without a row pays the latest row's.
bonuses:
  - { year: 2005, amounts: [1500000, 2000000, 2500000, 3000000, 3500000, 3500000, 3500000, 3500000] }
  - { year: 2006, amounts: [3500000, 4000000, 4500000, 5000000, 5500000, 6000000, 6500000, 7000000] }
  - { year: 2007, amounts: [4500000, 5000000, 6000000, 7500000, 8500000, 9000000, 9500000, 10000000] }
  - { year: 2008, amounts: [750000, 1000000, 1250000, 1500000, 1750000, 2000000, 2250000, 2500000] }
  - { year: 2009, amounts: [750000, 1000000, 1500000, 2000000, 2500000, 3000000, 3000000, 3000000] }
  - { year: 2010, amounts: [1250000, 1500000, 2000000, 2500000, 3000000, 3500000, 4000000, 4500000] }
  - { year: 2011, amounts: [1500000, 2000000, 2500000, 3000000, 3500000, 4000000, 4500000, 5000000] }
  - { year: 2013, amounts: [1500000, 2000000, 2500000, 3250000, 4000000, 4750000, 5500000, 6000000] }
  - { year: 2015, amounts: [2500000, 3000000, 4000000, 6000000, 7500000, 8500000, 9500000, 10000000] }
# bands: salaries a year at a New York firm for people off the scale, by level (TST's role
# bands by city, spec 5.4); a city's pay is band x pay.city_bp. Counsel and income partners
# also take a discretionary bonus (pay.discretionary_bonus_bp).
bands:
  paralegal: 6000000
  trainee: 5000000 # UK trainees (v2)
  counsel: 26000000
  income_partner: 40000000
  staff: 5000000
  manager: 9000000
  director: 15000000
  chief: 25000000
