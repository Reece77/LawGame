# Runs `make check` (vendoring, backend lint, types, tests; API client sync; frontend lint,
# types, tests) on every push and pull request.
#
# PT-M11 (product manager, 2026-11-23: main's check had reached its 30-minute limit): the backend
# tests run in three parallel shards (`make check-shard`, a stable split by test file,
# tools/test_shard.py); vendoring, lint, types, the turn-time budgets, API sync and the front end
# run in one `static` job beside them; the job named `check` passes only when every shard and
# `static` succeeded (a skipped or cancelled one fails it).
name: check

on:
  push:
  pull_request:

concurrency:
  group: check-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install backend dependencies
        run: uv sync --project backend --locked
      - name: Every test file is in one shard
        run: python3 tools/test_shard.py --check 3
      - name: make check-shard
        run: make check-shard SHARDS=3 SHARD=${{ matrix.shard }}

  static:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install backend dependencies
        run: uv sync --project backend --locked
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: make check-vendored check-lint check-timing check-api check-frontend
        run: make check-vendored check-lint check-timing check-api check-frontend

  check:
    needs: [tests, static]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard and the static job succeeded
        run: |
          echo "tests: ${{ needs.tests.result }}, static: ${{ needs.static.result }}"
          test "${{ needs.tests.result }}" = "success" && test "${{ needs.static.result }}" = "success"
