# Behavior tags (spec section 5.1; formulas.md section 2, step 7).
# Ported from backend/data/tags.yaml @ 02fba2aa (Tech Startup Tycoon); changed: Partner
# Track's new tags appended (rainmaker, grinder, client whisperer, cowboy, rule-bender,
# lifer, free agent) and the `negative` flag (ADR PT-0013: a negative tag is never attached
# to a person flagged real). TST's nine tags keep their order and values.
# Generation: process tags in this order. A tag is skipped if it is excluded by a tag
# already assigned. Chance = base_bp, multiplied by boost.multiplier when every boost
# condition holds on the person's TRUE values. Stop after people.max_tags (2).
# effect_note records what the tag does and the milestone that builds the effect; PT-M1a
# implements only grinder's strain load (strain.grinder_load).
tags:
  - key: mentor
    label: Mentor
    base_bp: 400
    boost: { multiplier: 3.0, when: [{ attr: sociability, op: ">=", value: 13 }, { attr: temperament, op: ">=", value: 13 }] }
    excludes: [toxic_high_performer, credit_taker]
    reveal_text: "is a natural mentor"
    effect_note: "M2: raises growth of direct reports and teammates."

  - key: quiet_genius
    label: Quiet genius
    base_bp: 250
    boost: { multiplier: 3.0, when: [{ attr: sociability, op: "<=", value: 7 }, { attr: professionalism, op: ">=", value: 14 }] }
    excludes: [politician]
    reveal_text: "does exceptional work without seeking attention"
    effect_note: "M3: bonus to project quality; reveals more slowly than other tags."

  - key: credit_taker
    label: Credit-taker
    base_bp: 300
    boost: { multiplier: 2.5, when: [{ attr: ego, op: ">=", value: 15 }, { attr: integrity, op: "<=", value: 8 }] }
    excludes: [culture_carrier, mentor]
    reveal_text: "tends to take credit for the team's work"
    effect_note: "M2: lowers teammates' morale and relationships."
    negative: true

  - key: politician
    label: Politician
    base_bp: 300
    boost: { multiplier: 2.5, when: [{ attr: ambition, op: ">=", value: 15 }, { attr: sociability, op: ">=", value: 14 }] }
    excludes: [quiet_genius]
    reveal_text: "is skilled at office politics"
    effect_note: "M2: faster promotion; can trigger conflict events (M6)."

  - key: maverick
    label: Maverick
    base_bp: 300
    boost: { multiplier: 2.5, when: [{ attr: risk_appetite, op: ">=", value: 15 }, { attr: adaptability, op: ">=", value: 13 }] }
    excludes: []
    reveal_text: "likes to go their own way"
    effect_note: "M3: higher variance on project outcomes; breakthrough chance in R&D (v2)."

  - key: perfectionist
    label: Perfectionist
    base_bp: 350
    boost: { multiplier: 2.5, when: [{ attr: professionalism, op: ">=", value: 16 }] }
    excludes: []
    reveal_text: "will not ship until it is right"
    effect_note: "M3: higher quality, slower delivery, more stress."

  - key: job_hopper
    label: Job-hopper
    base_bp: 400
    boost: { multiplier: 2.5, when: [{ attr: loyalty, op: "<=", value: 6 }] }
    excludes: [culture_carrier]
    reveal_text: "has moved jobs often"
    effect_note: "M1b: doubles monthly resignation chance."

  - key: culture_carrier
    label: Culture carrier
    base_bp: 300
    boost: { multiplier: 3.0, when: [{ attr: loyalty, op: ">=", value: 15 }, { attr: sociability, op: ">=", value: 13 }, { attr: integrity, op: ">=", value: 13 }] }
    excludes: [job_hopper, credit_taker, toxic_high_performer]
    reveal_text: "holds the team together"
    effect_note: "M1b: firing them costs everyone 6 morale instead of 3. M2: lifts team morale."

  - key: toxic_high_performer
    label: Toxic high performer
    base_bp: 150
    boost: { multiplier: 4.0, when: [{ attr: ego, op: ">=", value: 16 }, { attr: temperament, op: "<=", value: 6 }] }
    excludes: [mentor, culture_carrier]
    reveal_text: "gets results but wears people down"
    effect_note: "M2: bonus to own output, morale drain on teammates."
    negative: true

  - key: rainmaker
    label: Rainmaker
    base_bp: 250
    boost: { multiplier: 3.0, when: [{ attr: ambition, op: ">=", value: 14 }, { attr: sociability, op: ">=", value: 14 }] }
    excludes: [grinder]
    reveal_text: "brings in work wherever they go"
    effect_note: "PT-M3a: origination x1.5."

  - key: grinder
    label: Grinder
    base_bp: 400
    boost: { multiplier: 2.5, when: [{ attr: professionalism, op: ">=", value: 14 }, { attr: sociability, op: "<=", value: 8 }] }
    excludes: [rainmaker]
    reveal_text: "can bill punishing hours without cracking"
    effect_note: "PT-M1a: strain load x0.7. PT-M3a: business development x0.7."

  - key: client_whisperer
    label: Client whisperer
    base_bp: 250
    boost: { multiplier: 3.0, when: [{ attr: sociability, op: ">=", value: 15 }, { attr: temperament, op: ">=", value: 13 }] }
    excludes: []
    reveal_text: "clients trust them instinctively"
    effect_note: "PT-M3a: relationship gains x1.4."

  - key: cowboy
    label: Cowboy
    base_bp: 200
    boost: { multiplier: 3.0, when: [{ attr: risk_appetite, op: ">=", value: 15 }, { attr: professionalism, op: "<=", value: 8 }] }
    excludes: [perfectionist]
    reveal_text: "cuts corners to get things done"
    effect_note: "PT-M3a: faster work; error and malpractice risk x2."
    negative: true

  - key: rule_bender
    label: Rule-bender
    base_bp: 150
    boost: { multiplier: 4.0, when: [{ attr: integrity, op: "<=", value: 6 }] }
    excludes: [culture_carrier]
    reveal_text: "has been padding their time"
    effect_note: "PT-M3b: billing padding risk; hidden until a dispute or audit."
    negative: true

  - key: lifer
    label: Lifer
    base_bp: 300
    boost: { multiplier: 3.0, when: [{ attr: loyalty, op: ">=", value: 16 }] }
    excludes: [job_hopper, free_agent]
    reveal_text: "means to retire here"
    effect_note: "PT-M1b: loyalty never below 14 in morale and resignation."

  - key: free_agent
    label: Free agent
    base_bp: 300
    boost: { multiplier: 2.5, when: [{ attr: loyalty, op: "<=", value: 7 }, { attr: ambition, op: ">=", value: 13 }] }
    excludes: [lifer, culture_carrier]
    reveal_text: "moves firms every few years"
    effect_note: "PT-M1b: moves every 3-5 years."
