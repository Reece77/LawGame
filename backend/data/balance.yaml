    start_score: 35 # a new relationship's score after an RFP win
  boutique: # TST 15.4's startups for law: partner groups leave to found boutiques
    monthly_bp: 15 # chance a month that some large rival's partner group leaves (all rivals together, bp)
    partners: { lo: 2, hi: 6 }
