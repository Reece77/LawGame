  jab_feud: 0.5 # + this x feud / 100
  reminder_months: [1, 3] # a broken claim's reminder comes this many months later
  memory_months: 24 # answered moments and statements kept
  energy_answer: 2 # mirrors energy.cost.press_answer (shown on the Press screen)
  claims: # public claims (spec 12.2; TST 29.2's promises)
    max_open: 3
    months: [3, 36] # a headcount or band claim is due 3-36 months out
    fixed_months: 12 # no layoffs and matching the scale run 12 months
    kept_rep: 4.0 # reputation points, every practice, x a x (1 + ambition) x credibility factor (TST kept_brand)
    kept_cred: 5.0 # credibility, x a
    kept_morale: 2.0 # morale points for no layoffs kept
    broken_rep: 8.0 # reputation points lost, x a (TST broken_brand)
    broken_cred: 10.0 # credibility lost, x a
    broken_morale: 5.0 # morale points lost for no layoffs broken
    broken_trust: 10.0 # partners' confidence in the managing partner (TST: trust in the founder -10)
    headcount_span: 1.0 # doubling the lawyers scores a headcount claim's full target ambition
    band_span: 3 # three bands of climb score a band claim's full target ambition
    fixed_ambition: 0.2
  feud: # rival managing partners (TST 29.4)
    bold_mention: 10.0
    poach: 15.0 # each key partner hired from them
    approach: 5.0 # they approached one of the player's people
    decay: 2.0 # points a month
    rivalry: 50.0
    rivalry_stance: 1.0 # the rival's stance toward the player at rivalry (PT-M5's label)
    causes_kept: 8
rankings: # PT-M16: tables, league tables, directory bands, the associates' survey (spec 12.3)
  tables:
    month: 4 # April: the spring tables for the prior fiscal year (Am Law publishes in late April)
    revenue_places: 200 # the Am Law 100 and 200 analogue
    pep_places: 100
    min_revenue_cents: 6000000000 # $60M: a firm enters the tables once its revenue is this large (about the Am Law 200's last place in 2005)
  league:
    kinds: [deal, restructuring] # matter kinds the tables count (practices.yaml)
    value_per_fee: 400.0 # a deal's transaction value per dollar of the firm's fees [A]
    rival_deal_share: 0.6 # share of a rival's practice fees from deals [A]
    places: 10 # places published (the player's row is always shown)
  directory:
    month: 10 # October's bands
    thresholds: [72, 60, 50, 40, 30, 15] # PT-M16 tuning band 6 20 -> 15 (a spin-out of strong partners enters band 6 in its founders' practice within two years, as up-and-coming firms do); score (reputation + the player's key matters and submission) for band 1..6; below 15 not ranked (2005: every dossier strength scores 76+, so history's leaders are band 1)
    submission_months: [3, 4] # the March-April submission window
    max_matters: 5
    max_referees: 5
    referee_cost: 2.0 # relationship points each referee spends
    energy: 6 # mirrors energy.cost.submission (shown on the Rankings screen)
    submission_points: 6.0 # score points for the strongest submission (strength 1)
    no_submission: 4.0 # score points lost with no submission
    matter_full_cents: 100000000 # $1M fees: a showcased matter's full weight
    key_matters: 4.0 # score points for the last year's key matters at a third of the full record
    appeal_bonus: [0.08, 0.05, 0.03, 0.01, 0.0, 0.0] # the appeal's Rep added by band 1..6 for the year (spec 7.1)
    recruit_bonus: [0.06, 0.04, 0.02, 0.01, 0.0, 0.0] # offer-score points by band in the candidate's practice
    standing_band: { elite: 1, leading: 2, strong: 3 } # a real notable's individual band (notables.yaml standing)
    people_min_matters: 3 # public matters led in three years to be named
    people_offset: 1 # a named partner's band: the firm's band + 1, one better per extra matter led
  places:
    month: 7 # July: Best places to work, before August's campus offers
    min_associates: 10 # firms with fewer associates are not surveyed
    places: 20 # places published (the player's always shown)
    weights: { morale: 0.4, hours: 0.25, pay: 0.2, training: 0.15 }
    hours_best: 1800 # billable hours a year a lawyer scoring the full hours term
    hours_worst: 2600 # and scoring nothing
    training_full: 3.0 # partners per ten associates for the full training term
    rival_base: { elite_lockstep: 72, global_verein: 60, performance_machine: 58, litigation_boutique: 66, tech_coast: 70, regional_champion: 64, volume_mid_market: 50, big_four_legal: 55 } # a rival's survey score 0-100 by personality [A]
    rival_utilisation: 0.5 # survey points a rival loses per point of utilisation above 85%
    top: 10 # a place this high or better earns the campus bonus for a year
    campus_bonus: 0.05 # offer-score points on campus offers
  news_top: 5 # names from each list's top in its inbox item
automation: # PT-M9: automation everywhere (spec 9.4; TST formulas.md 40)
  change_energy: 2 # the MP's energy points to give an area or take it back (TST 40.1)
  owner_energy: 100 # workload points an owner has a month for their areas (TST 40.3)
  action_energy: 40 # energy points an owner's area has for its actions each month; the owner's own energy is left as it was
  overload_per_energy: 0.004 # q falls by this for each workload point an owner's areas cost beyond owner_energy (the brief: overload lowers q)
  overload_floor: 0.3 # q never falls below this from overload
  quality: { base: 0.55, per_score: 0.03, min: 0.6, max: 0.98 } # P(the default rule's answer) = clamp(base + per_score x s), s the owner's TRUE seat score (spec 9.4)
  mistake_noise: 0.3 # a mistake's noisy alternative: the rule's number x (1 +- up to this), within the guardrails
  default_limit_bp: 200 # an area's default per-decision limit: bp of the firm's cash when given (TST 40.2)
  min_limit_cents: 2500000 # and at least this ($25,000)
  limit_round_cents: 1000000 # rounded down to this ($10,000)
  monthly_limit_mult: 3 # the default monthly limit: this x the per-decision limit (TST 40.2)
  commitment_months: 12 # a decision commits its cash cost over this many months plus its fixed obligations
  proposal_months: 3 # an unanswered proposal expires (as declined) after this many months
  repropose_months: 6 # an owner does not propose a declined or expired move again for this many months
  keep_decision_turns: 24 # months of area decisions kept (the screen, the record, the digest)
  near_limit_bp: 8000 # the digest flags a decision committing at least this share of its limit (bp)
  take_back_morale: 2 # morale points a high-ego owner loses when an area is taken back soon after it was given (TST 40.1)
  take_back_months: 6 # "soon": within this many months
  high_ego: 15 # ego at or above which an owner minds
  proposal_month: 11 # the development area proposes partnership candidates in this month, for December's vote
  pro_bono_month: 1 # the pro bono area reviews the credit policy once a year, in this month
  # Each area (spec 9.4's table; the order is the area index, stream auto_quality's key):
  # label; rule; who (seat: the seat's holder owns it; partner: any partner but the MP);
  # seat (seats.yaml); seat_rule (the area runs the seat's PT-M8 authority rule with the
  # seat's guardrails, which are added to the area's own); available; energy (workload points
  # a month); weights (s for a seatless owner); guardrails (key, label with its unit, default,
  # min, max; integers); does (the screen's text).
  areas:
    staffing:
      label: Staffing
      rule: staffing
      seat: practice_group_leader
      seat_rule: true
      energy: 20
      does: "Opens associate hiring plans for the group when it runs hot, within a headcount cap; the firm's staffing rule allocates the group's work."
    intake:
      label: Intake and conflicts
      rule: intake
      seat: general_counsel
      seat_rule: true
      energy: 15
      does: "Asks for waivers on held instructions; a waiver adverse to a key client comes to you."
    billing:
      label: Billing and collections
      rule: billing
      seat: cfo
      seat_rule: true
      energy: 20
      guardrails:
        - { key: revolver_months, label: "Keep the revolver under (months of fees)", default: 1, min: 0, max: 6 }
      does: "Writes down long-unbilled time within a band and repays the revolver from spare cash."
    pricing:
      label: Pricing and rates
      rule: pricing
      seat: pricing_director
      seat_rule: true
      energy: 10
      does: "Sets each January's rate rise within a band around the market's."
    bd:
      label: Business development
      rule: bd
      seat: cmo
      seat_rule: true
      energy: 25
      guardrails:
        - { key: intros_per_month, label: "Introductions a month", default: 1, min: 0, max: 5 }
        - { key: min_relationship, label: "Introduce at clients with a relationship of at least", default: 50, min: 0, max: 100 }
      does: "Pitches for open RFPs with the best team it can see and introduces colleagues to good clients."
    hiring:
      label: Associate hiring and campus
      rule: hiring
      seat: chro
      seat_rule: true
      energy: 25
      guardrails:
        - { key: busy_bp, label: "Hire laterals above this utilisation (bp)", default: 8000, min: 5000, max: 11000 }
        - { key: lateral_step, label: "Lateral associates a plan asks for (people)", default: 2, min: 1, max: 10 }
        - { key: pay_pct_bp, label: "Associate pay (bp of the market; above it comes to you)", default: 10000, min: 8000, max: 12000 }
      does: "Registers campus classes, opens lateral associate plans when the firm is busy and keeps associate pay at the market."
    development:
      label: Associate development
      rule: development
      seat: chro
      energy: 15
      guardrails:
        - { key: sponsors_per_month, label: "Sponsors assigned a month", default: 2, min: 0, max: 10 }
        - { key: lawyers_per_equity, label: "Lawyers per equity partner (business case)", default: 4, min: 2, max: 20 }
      does: "Finds sponsors for senior associates and proposes the partnership candidates the business case supports."
    laterals:
      label: Lateral partners
      rule: laterals
      seat: executive_committee
      energy: 25
      guardrails:
        - { key: lawyers_per_practice, label: "A new practice for each (lawyers)", default: 30, min: 10, max: 200 }
        - { key: leverage_x10, label: "Hire a partner above this leverage (associates a partner x 10)", default: 40, min: 10, max: 100 }
        - { key: busy_bp, label: "and this utilisation (bp)", default: 8000, min: 5000, max: 11000 }
        - { key: min_book_k, label: "Smallest book (low end, $k)", default: 1000, min: 0, max: 20000 }
        - { key: guarantee_years, label: "Guaranteed years offered (a guarantee comes to you)", default: 0, min: 0, max: 3 }
        - { key: cash_months, label: "Only with cash above (months of fees)", default: 2, min: 0, max: 12 }
      does: "Screens and approaches lateral partners with books for new practices and leverage; every guarantee comes to you."
    offices:
      label: Offices and support
      rule: offices
      seat: coo
      energy: 10
      guardrails:
        - { key: support_per_100, label: "Support staff per 100 lawyers (0: off)", default: 0, min: 0, max: 50 }
      does: "Keeps business-services support at its level (fit-outs and leases come to you as pitches)."
    knowledge:
      label: Knowledge and AI
      rule: knowledge
      seat: cko
      energy: 15
      guardrails: # PT-M14
        - { key: budget_per_lawyer, label: "AI subscriptions a lawyer a month ($)", default: 1500, min: 0, max: 5000 }
        - { key: training_hours, label: "Training programme (hours a lawyer a year)", default: 40, min: 0, max: 200 }
        - { key: rollout, label: "Put firm-wide rollouts to the partners (1 yes, 0 no)", default: 1, min: 0, max: 1 }
      does: "Subscribes to each available era's tools within the budget (newest first), keeps the training programme and puts rollouts to the partners; a new platform comes to you."
    risk:
      label: Risk and claims
      rule: risk
      seat: general_counsel
      energy: 5
      does: "Keeps the conflict checks running (claims and insurance arrive with PT-M15)."
    pro_bono:
      label: Pro bono
      rule: pro_bono
      who: partner
      energy: 10
      weights: { leadership: 0.3, communication: 0.3, client_care: 0.2, supervision: 0.2 }
      guardrails:
        - { key: target_hours, label: "Pro bono hours a lawyer a year", default: 60, min: 0, max: 300 }
        - { key: tolerance_pct, label: "Act when this far off (%)", default: 25, min: 5, max: 100 }
        - { key: step_hours, label: "Credit step (hours a year)", default: 25, min: 5, max: 100 }
      does: "Keeps pro bono hours at the policy level by moving the credit policy."
    events:
      label: Routine events
      rule: events
      seat: coo
      energy: 10
      does: "Answers routine events no other automated area answers; critical events always come to you."
tech: # PT-M14: legal technology and AI (spec 13; ADR PT-0011; ptk/sim/tech/, data/legal_eras.yaml)
  exposed_min: 0.5 # a task is "exposed" (review, diligence, research, drafting) at this practices.yaml ai_exposure or more
  adoption: # ADR PT-0011 3: adoption 0-1 by era moves monthly toward a target set by coverage, training and buy-in
    speed: 0.08 # share of the gap to the target closed a month (about 2 years to 85%)
    decay: 0.05 # share of the excess over a lower target lost a month (no upkeep: adoption decays)
    cko_speed: 0.5 # speed x (1 + this x the CKO's e) (spec 9.1: AI adoption speed)
    training_share: 0.4 # share of the target that needs the training programme (the rest needs only the tools)
    training_full_hours: 30 # programme hours a lawyer a year at which training counts in full toward adoption
    cko_training: 0.3 # training's effective hours x (1 + this x the CKO's e) (spec 9.1: training effectiveness)
    buyin_from: 4.0 # partners' mean (adaptability + technology) / 2, 1-20: buy-in 0 at or below this (partners' technology averages ~4 before 2016's generations: pt-2022's 26 partners read 7.0)
    buyin_to: 12.0 # ... and 1 at or above this; the target is x (buyin_floor + (1 - buyin_floor) x buy-in)
    buyin_floor: 0.7 # the target's share that needs no buy-in (the tools work for the willing)
    support_score: 6.5 # a partner supports a firm-wide rollout at (adaptability + technology) / 2 + noise >= this (pt-2022: about 55% of partners on a vote)
    rollout_threshold_bp: 5000 # share of equity partners who must support (more than; a simple majority)
    vote_sd: 2.0 # each partner's noise in the rollout vote (stream tech_vote, 111), attribute points
    pilot_cap: 0.35 # adoption never exceeds this without a firm-wide rollout (a pilot group)
    retry_months: 6 # months before a failed rollout can be put to the partners again
    platform_months: 36 # a platform's cost amortises to 6100 over this many months
    full_from: 0.999 # adoption at or above this reads as full on the screen
  clients: # ADR PT-0011 4: client expectations follow the market's average adoption with a lag
    pressure_from: [2016, 1] # first month clients press hourly bills on exposed tasks (pre-2016 eras are weak; T1-T12 to 2015 unchanged)
    lag_months: 12 # clients expect what the market could do this many months ago
    pass_through: 0.7 # share of the hours the market no longer needs that clients refuse to pay for (Reece q15: "clients claw back much of it")
    discount: 0.25 # share of the market's saving clients also ask every firm to pass on, on hourly bills (dossier s4: 80% of Fortune 1000 executives expect lower bills from AI); PT-M14 tuning 0.10 -> 0.25
    max_cut: 0.6 # the most a task's realisation can fall (share of its fees)
    rfp_from_year: 2023 # panel RFPs ask for AI and efficiency claims from this year (dossier s1: firm-wide tools 2023)
    w_rfp: 0.6 # RFP score points per unit of (firm AI score - market AI score), -1..1; the ai_efficiency pitch claim (rivals.rfp.w_claim) is substantiated at 0 or more
  training: # ADR PT-0006 4 and PT-0011 5: buying back juniors' learning
    hours: { lo: 0, hi: 200, default: 40 } # the programme, non-billable hours a lawyer a year (dossier s6: Ropes & Gray credits up to ~400 AI hours)
    cost_cents_per_hour: 5000 # $50 an attendee-hour: trainers and materials (6100) [A]
    levels: [associate_1, associate_2, associate_3, associate_4, associate_5, associate_6, associate_7, associate_8, senior_associate, counsel] # who attends
    learn_loss: 1.0 # substantive share lost per unit share of a person's task hours AI removes (no training)
    restore: 0.8 # share of that loss a full programme buys back (the brief: at least half)
    full_hours: 40 # programme hours a lawyer a year that count as full coverage for learning
  products: # spec 13, 7.7: fixed-price products for a matter kind
    stage: 3 # the firm's stage from which it may launch products
    price_bp: { lo: 6000, hi: 15000, default: 10000 } # bp of what the market expects the work to cost (expected fees x market efficiency)
    max_products: 10 # active products at once
    accept_full_bp: 10000 # every client takes a product priced at or below this (bp of the market's cost) (Reece, 2026-11-23)
    accept_none_bp: 15000 # ... and none at this; between, the share falls linearly; the rest keep their drawn terms

# PT-M11: offices, cities and the UK path (ptk/sim/geo; spec 8.8, 5.2, 5.7, 11.1). Sources and
# tags: docs/research/london-and-us-cities.md. Lease rent per seat and local markets are in
# cities.yaml; bar rules, insurance and the London scale in bar_rules.yaml.
geo:
  seat_sizes: [5, 10, 15, 25, 50, 100] # lawyer seats a lease may be sized for
  lease_months: 120 # a lease's term (a renewal starts another) [A] dossier s7: 10-15 years typical
  fit_out_per_seat_cents: 2500000 # $25,000 a lawyer seat, once, to 1500 and amortised over the term [A] dossier s7
  close_penalty_months: 6 # months of rent to break a lease early, once (6000)
  reach_penalty: 1.5 # appeal logit points off a client's work in a city where the firm has no office (spec 8.8's local reach)
  lift_portability: [0.55, 0.9] # a lifted partner's share of book clients that follow (uniform; hidden); a lateral group's is PT-M4's 0.3-0.7
  lift_months: 6 # a lifted team's clients follow within this many months (PT-M4's laterals: 12-24)
  organic_clients: 0 # local clients an organic start's partner is introduced to: none (PT-M11 decision 5: it builds its book through RFPs and pitches)
  organic_relationship: [10.0, 20.0] # their relationships start between these (0-100)
  omp_appeal: 0.4 # appeal logit points x the office managing partner's e on the office's clients (spec 9.1: local BD)
  lift_associates_per_partner: 3.0 # a team lift's associates per lifted partner
  lift_book_share: 0.6 # share of a lifted partner's book that comes as named clients
  local_client_revenue_bn: [0.4, 6.0] # a generated local client's 2005 revenue, USD bn (log-uniform)
  training_contract_cost_cents: 1500000 # $15,000 a contract: the LPC fees and a grant (6200) [A] dossier s3
  trainee_seat_months: 6 # four six-month seats (spec 5.2)
  training_months: 24 # a training contract's two years
  qualify_month: 9 # trainees qualify each September (newly qualified, class 1)
  contract_lead_years: 2 # training contracts are offered two years ahead
  max_contracts: 30 # an office's training contracts offered in a year at most
  rfl_cost_cents: 100000 # registering a US lawyer as a registered foreign lawyer (6200) [A] dossier s6


# PT-M13: mergers and the verein (ptk/sim/mergers; spec 8.8; ADR PT-0016; TST formulas.md 28, 31).
# Sources and tags: docs/research/law-firm-mergers.md. [A] unless a tag says otherwise.
mergers:
  max_lawyers: 400 # a firm of at most this many lawyers can be integrated (TST 28.5's 250-staff rule, re-cast); larger ones join a verein or absorb the player
  absorbed_below_bp: 3000 # the player's partners below this share of the merged profit pool: the player's firm is absorbed (the campaign ends as an exit)
  vote_bp: 6667 # each partnership's threshold, bp of votes cast (spec 8.8: two thirds) [S dossier s7]
  confidential_months: 6 # talks open longer than this leak to the legal press (a press moment)
  leak_nudge: -3.0 # confidence points each of the player's partners loses when talks leak
  talks_months: 9 # talks with no step for this many months lapse
  cooldown_months: 12 # after talks end, no new approach between the two firms (TST 28.3)
  books: # the other firm's closing sheet from its run-rates (ADR PT-0016 2)
    wip_days: 60 # unbilled WIP, days of fees (lockup 135 days in all: T7's 90-150)
    ar_days: 75 # receivables, days of fees
    ar_due_months: 3 # carried receivables are collected over this many months
    cash_months: 1.0 # cash, months of its costs (a working float)
    debt_share: 0.25 # its revolver, share of WIP and receivables (ADR PT-0003's borrowing base)
    annuity_share: { lo: 0.0, hi: 0.35 } # hidden: retired partners' annuities, share of WIP and receivables (uniform per firm; Dewey's trap)
    lease_years: { lo: 2.0, hi: 10.0 } # hidden: years left on its headquarters' lease (uniform per firm)
    rent_per_seat_cents: 300000 # a month per lawyer where its city has no rent in cities.yaml
    wip_rate_cents: 40000 # carried WIP counts as hours at $400 an hour (the flow accounts' hours)
    annuity_years: 10 # carried annuities are paid monthly over this many years (PT-M17's annuities)
    facility_mult: 1.5 # the merged revolver's facility grows by the carried debt x this (headroom)
  book: # the other firm's client book, drawn when talks open
    client_cents: 75000000 # $750k of its revenue a year per book client (PT-M4's lateral books)
    max_clients: 120
    relationship: { lo: 45.0, hi: 70.0 } # its relationships' scores (founders' books: 55-70)
    adverse_p: 0.06 # a book client's engagement adverse to another client (the conflicts clearance solves)
    adverse_player_bias: 4.0 # weight of the player's clients among adverse parties (firms in one market meet)
    practices_per_client: 2 # practices each book client instructs it in, at most
  diligence:
    fee_bp: 25 # professional fees a level, bp of the other firm's revenue (6600)
    min_fee_cents: 15000000 # $150,000 a level at least
    months: 2 # months a level takes (TST 28.2)
    half_width: [0.6, 0.35, 0.18, 0.08] # a range's half width by level (0: none yet), share of the value
    offset_share: 0.8 # the fixed offset is at most this share of the half width (the midpoint is not the truth)
  answer: # how the other partnership answers (stream merger_answer)
    talk_bias: { elite_lockstep: null, global_verein: 0.6, regional_champion: 0.5, performance_machine: 0.1, litigation_boutique: -0.1, tech_coast: 0.2, volume_mid_market: 0.4, big_four_legal: null } # null: never merges (spec 10.1)
    complement_weight: 1.0 # talks: points per unit of the player's lawyers in practices it lacks (share)
    pep_weight: 0.5 # talks: points per unit of PEP ratio (the player's over its own) above 1
    region_weight: 0.3 # talks: points when the player brings a region it lacks
    noise_sd: 0.35 # each answer's noise (talks once; terms per partner)
    pep_change_weight: 4.0 # terms: points per unit of a partner's expected PEP change
    synergy_bp: 800 # partners expect the merged profit pool 8% above the two pools' sum (cross-selling, the case every merger is sold on) [A dossier s3: two thirds of large mergers then grew PEP more slowly than peers]
    mp_weight: 0.25 # terms: their side loses the managing partner
    name_weight: 0.15 # terms: their name goes
    comp_weight: 0.2 # terms: their comp system changes
    rate_weight: 1.0 # terms: points lost per unit of rate card rise for their clients
    counter_margin: 0.03 # a counter asks for the share that gives its median partner this PEP rise
    max_rounds: 2 # terms answered at most this many times; then talks end
  clearance: # conflicts clearance (ADR PT-0009 4)
    waiver_base: 0.15 # a waiver's chance at no relationship
    waiver_rel: 0.35 # ... plus this x the relationship / 100
    waiver_max: 0.6
  integration: # after closing (TST 28.5, re-cast)
    months: 24 # integration lasts this long (T13 reads partners lost in it)
    clash_comp: # comp-system distance 0-1 (pairs; missing pairs and same systems 0)
      lockstep: { modified_lockstep: 0.3, eat_what_you_kill: 1.0, committee: 0.6 }
      modified_lockstep: { eat_what_you_kill: 0.7, committee: 0.4 }
      eat_what_you_kill: { committee: 0.5 }
    personality_distance: 0.3 # distance added when the firms' personalities differ (the player's from its comp system)
    flight_mult: 1.2 # the other side's partners' flight x (1 + this x clash)
    pep_fall_mult: 1.5 # a partner whose PEP fell after closing: flight x (1 + this)
    subordinated_mult: 1.0 # a partner whose practice the other side dominates: flight x (1 + this)
    subordinated_share: 0.25 # their side's share of the practice's lawyers below this: subordinated
    balk_bp: 120 # a book client's monthly chance of leaving per unit of card rise x price sensitivity / 10 (bp)
    balk_months: 12 # clients balk in the first year
    surrender_months: 6 # months of rent to surrender a home-city lease (PT-M11's close penalty)
    confidence_nudge: 10.0 # confidence points per unit of a side's expected PEP change, at closing
  verein: # ADR PT-0016 5 (TST 31, re-cast)
    cost_base_cents: 25000000 # $250,000 a month of shared brand, technology and management
    cost_bp: 20 # plus this bp of the members' revenue a month (about 2.4% a year)
    referral_months: 3 # a member introduces the player to one of its clients every this many months
    referral_score: { lo: 20.0, hi: 35.0 } # the introduction's relationship score
    talk_bias: { elite_lockstep: null, global_verein: 0.8, regional_champion: 0.4, performance_machine: 0.0, litigation_boutique: -0.3, tech_coast: 0.0, volume_mid_market: 0.3, big_four_legal: null }
    appeal_share: 0.1 # appeal logit points per member firm on the player's clients (reputation shared)
  rival: # rivals' merger decisions (stream rival_merger)
    approach_bp: 40 # a month's chance that a rival with a reason approaches the player (all rivals together)
    approach_min_utility: 0.3 # the talks utility a rival needs to approach
    min_player_lawyers: 20 # rivals approach only a firm at least this large
