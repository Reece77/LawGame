# Ported from .github/workflows/nightly.yml @ 121d318a (Tech Startup Tycoon); changed: two parts, no shards.
# The long balance runs (PT-M7; TST's nightly, ported): `make balance` prints the
# docs/balance-targets.md table (and fails on a gate: T1, T2, T11, T12), then `make nightly`
# runs every test marked `nightly`. Every night, and on demand from the Actions tab
# (`workflow_dispatch` on a branch, CLAUDE.md section 9 rule 7).
name: nightly

on:
  schedule:
    - cron: "17 4 * * *" # 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Skip the scheduled run when `main` has not changed in the last 25 hours (TST's rule):
  # the results would only repeat the last night's. A manual run always runs.
  changed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          n=$(git log --since="25 hours ago" --oneline | wc -l)
          echo "commits on main in the last 25 hours: $n"
          if [ "$n" -gt 0 ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

  nightly:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    name: nightly (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        part: [balance, nightly]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        run: uv sync --project backend --locked

      - name: make ${{ matrix.part }}
        run: make ${{ matrix.part }}
