# Inbox wording (PT-M1b). Ported from backend/data/inbox_templates.yaml @ 02fba2aa (Tech Startup
# Tycoon); changed: Partner Track's hiring templates only, with law-firm wording. The sim emits a template key
# plus parameters; persistence renders the title and body for the player's firm. Parameters
# ending in _cents are shown as money; "{role:a}" adds the indefinite article.
# Every key the engine uses must exist here (a test checks).
templates:
  candidates_arrived:
    title: "{count} candidates for {role}"
    body: "Your {channel} search for {role:a} turned up {count} candidates. They will consider offers for the next {shelf} months."
  summer_programme:
    title: "{count} summer associates arrive for {role}"
    body: "Your summer programme runs from May to July. Interview the summer associates you want; offers go out in August for a start next September."
  offer_accepted:
    title: "{name} accepted your offer"
    body: "{name} joins as {level:a} {role} on {salary_cents} a year."
  campus_offer_accepted:
    title: "{name} accepted a place in the class of {class_year}"
    body: "{name} will start as a first-year {role} in {start_label}, on the scale's salary for that year."
  offer_declined:
    title: "{name} declined your offer"
    body: "{name} has turned down the {role} role and is no longer a candidate."
  class_started:
    title: "{name} starts today"
    body: "{name} joins the firm as a first-year {role} on {salary_cents} a year."
  resigned:
    title: "{name} has resigned"
    body: "{name} has handed in their notice and will leave at the start of next month."
  employee_left:
    title: "{name} has left"
    body: "{name} has left the firm ({reason})."
  tag_revealed:
    title: "You noticed something about {name}"
    body: "You have noticed that {name} {reveal_text}."
  retained: # PT-M6: a counter-offer kept someone who had resigned (TST 23.3)
    title: "{name} is staying"
    body: "{name} has withdrawn their notice and is staying at the firm."
  bonuses_paid:
    title: "Year-end bonuses: {total_cents}"
    body: "The firm paid {count} year-end bonuses, {total_cents} in all, {policy} the market."
  # PT-M3a: clients and matters
  matter_opened:
    title: "New matter: {matter}"
    body: "The client has instructed the firm on {matter}, with expected fees of {fees_cents} at standard rates. The practice has staffed it by the default rule; change the team on the matter's page."
  matter_conflicted:
    title: "Conflict on {matter}"
    body: "The conflicts check found {matter} adverse to a current client, {affected}. Seek a waiver this month or the instruction is declined."
  matter_declined:
    title: "Declined: {matter}"
    body: "The firm declined {matter} for a conflict of interest."
  matter_closed:
    title: "{matter}: {result}"
    body: "{matter} has ended ({result})."
  settlement_offer:
    title: "Settlement offer on {matter}"
    body: "The other side offers {offer_cents} to settle {matter}. The offer is open until the end of next month."
  deadline_missed:
    title: "Deadline missed on {matter}"
    body: "The team on {matter} missed a deadline: the matter was under-staffed for its pace. The client has noticed."
  matter_disqualified:
    title: "Disqualified from {matter}"
    body: "A conflict that was never checked has surfaced: the firm is disqualified from {matter}, and both clients are unhappy."
  waiver_granted:
    title: "{client} waived the conflict"
    body: "{client} gave a waiver, and {matter} is open."
  waiver_refused:
    title: "{client} refused a waiver"
    body: "{client} would not waive the conflict; {matter} is declined."
  introduction_made:
    title: "{name} introduced to {client}"
    body: "{client} now instructs the firm in {practice}."
  introduction_failed:
    title: "{client} passed on {name}"
    body: "{client} did not take up the introduction in {practice}."
  # PT-M3b: billing and collections
  bill_disputed:
    title: "{client} disputes a bill"
    body: "{client} disputes {amount_cents} of a {bill_cents} bill. Concede, negotiate or hold firm on the Finance screen; unanswered, the billing team negotiates when the dispute's window closes."
  padding_found:
    title: "Padded time found on a bill to {client}"
    body: "A dispute has brought to light {amount_cents} of time on a bill to {client} that was never worked. The firm has credited it, and the client is not pleased."
  client_bankrupt:
    title: "{client} has filed for bankruptcy"
    body: "{client} has filed for bankruptcy. Its unpaid bills, {lost_cents} in all, have been written off as bad debts."
  # PT-M5: rival firms, panels and RFPs
  rfp_open:
    title: "{client} invites pitches: {kind}"
    body: "{client} has opened a {kind} covering {practices}. Pitch from the Market screen with a team and your claims before the award in two months."
  rfp_won:
    title: "{client} picks the firm"
    body: "{client} has chosen the firm in its RFP."
  rfp_lost:
    title: "{client} goes elsewhere"
    body: "{client} has chosen other firms in its RFP."
  rival_approach:
    title: "{firm} is courting {name}"
    body: "{firm} has offered {name} {offer_cents} a year to move. Counter on the Market screen this month, or {name} answers next month."
  rival_poached:
    title: "{name} is leaving for {firm}"
    body: "{name} has accepted {firm}'s offer and has given notice."
  rival_approach_declined:
    title: "{name} turns down {firm}"
    body: "{name} has declined {firm}'s approach and is staying."
  rival_joined:
    title: "{name} joins {firm}"
    body: "{name}'s notice is over: they are now at {firm}."
