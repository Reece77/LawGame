# Scenarios (spec 2.1, ADR PT-0002). start_ym is turn 0. Money in integer cents (2005 USD).
scenarios:
  - id: biglaw_spinout
    name: BigLaw spin-out
    description: >-
      An M&A partner and a litigator leave a large New York firm with two associates and
      their clients. $600,000 of partners' capital and a $1M revolver.
    start_ym: [2005, 1]
    home_city: new_york
    partners_capital_cents: 60000000
    revolver_limit_cents: 100000000
    home_jurisdiction: us_ny
    default_background: biglaw_ma_partner # the player's founding partner unless chosen
    co_founders: # other founding partners, built like the player's (spec 2.1)
      - { background: trial_lawyer, age: 46 }
    starting_staff: # generated at turn 0 (formulas.md 2 adapted)
      - { role: corporate_ma, level: associate_4 } # a fourth-year: eligible at the December 2008 vote at track 8 (PT-M7a)
      - { role: commercial_litigation, level: associate_2 }
  - id: solo_founder
    name: Solo founder
    description: >-
      One partner, one paralegal and a modest book. $150,000 of savings as capital.
    start_ym: [2005, 1]
    home_city: new_york
    partners_capital_cents: 15000000
    revolver_limit_cents: 25000000
    home_jurisdiction: us_ny
    default_background: regional_generalist
    co_founders: []
    starting_staff:
      - { role: paralegal, level: paralegal, practice: corporate_ma }
  - id: group_lift
    name: Group lift
    description: >-
      Three partners lift out of a failing firm with seven associates and their clients: ten
      lawyers, enough for practice groups from the first month. $1.2M of partners' capital
      and a $2M revolver.
    start_ym: [2005, 1]
    home_city: new_york
    partners_capital_cents: 120000000
    revolver_limit_cents: 200000000
    home_jurisdiction: us_ny
    default_background: biglaw_ma_partner
    co_founders:
      - { background: trial_lawyer, age: 48 }
      - { background: government_lawyer, age: 44 }
    starting_staff:
      - { role: corporate_ma, level: associate_5 }
      - { role: corporate_ma, level: associate_3 }
      - { role: corporate_ma, level: associate_1 }
      - { role: commercial_litigation, level: associate_6 }
      - { role: commercial_litigation, level: associate_2 }
      - { role: white_collar, level: associate_4 }
      - { role: white_collar, level: associate_1 }
      - { role: paralegal, level: paralegal, practice: commercial_litigation }
# Bar admissions (spec 2.1). v1 has one country; foreign and state rules arrive in v2.
jurisdictions:
  - { key: us_ny, label: New York }
  - { key: us_dc, label: District of Columbia }
  - { key: uspto, label: USPTO patent bar }
difficulties:
  - { id: easy, name: Easy, capital_mult_bp: 15000 }
  - { id: standard, name: Standard, capital_mult_bp: 10000 }
  - { id: hard, name: Hard, capital_mult_bp: 8000 }  # PT-M7: 6000 -> 8000 (T5: steady dissolved on 7 of 10 seeds at 6000)
  - { id: ironman, name: Ironman, capital_mult_bp: 10000 }  # difficulty from no reloads
