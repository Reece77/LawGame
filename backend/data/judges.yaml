# judges.yaml: real trial judges of the eight modelled courts, and published court statistics (PT-M5).
# Purpose: seeds the named judges (ADR PT-0013) who sit from January 2005, and the court-level
#   figures their procedural traits default to. Judges join and leave on these years until
#   December 2025; afterwards the engine moves them and new judges are generated.
# Sources: the research dossier docs/research/judges-2005.md (compiled 2026-11-20). Federal dates are
#   from Wikipedia's judgeship tables (compiled from the FJC Biographical Directory); court figures
#   from US Courts Federal Court Management Statistics, 12 months to 30 September 2005 (FCMS).
# Tags in src: S sourced, D derived (method stated), A assumed (basis stated).
# Fields: joined = year joined that court; left = year the judge stops hearing cases in the game
#   (elevated or left the bench as given; where only senior status is given, senior + 5, tagged A);
#   no `left` = still active in 2025; senior = senior status year (still hears cases).
#   Judges whose `left` falls before 2005 are omitted (they never sit in the game).
# Rules (ADR PT-0013): traits are procedural only (docket_speed, trial_appetite, discovery_strictness,
#   settlement_pressure, summary_judgment, sanctions_strictness; 1-20, 10.5 neutral) and only where a
#   sourced per-judge fact supports them; every other judge takes court figures plus seeded noise.
#   No trait ever favours a party, side or outcome. No appointing president, party, ideology or
#   politics. Leaving is recorded as kind and year only, never its cause.

court_stats:
  - { court: sdny, disposition_months: 8.8, trial_months: 22.0, trials_per_judgeship: 15, src: "S FCMS Sep 2005" }
  - { court: edny, disposition_months: 11.6, trial_months: 30.3, trials_per_judgeship: 16, src: "S FCMS Sep 2005" }
  - { court: ddel, disposition_months: 10.9, trial_months: 23.5, trials_per_judgeship: 20, src: "S FCMS Sep 2005" }
  - { court: ndcal, disposition_months: 9.8, trial_months: 28.0, trials_per_judgeship: 10, src: "S FCMS Sep 2005" }
  - { court: edtex, disposition_months: 10.3, trial_months: 15.9, trials_per_judgeship: 21, src: "S FCMS Sep 2005" }
  - { court: wdtex, disposition_months: 9.3, trial_months: 16.5, trials_per_judgeship: 26, src: "S FCMS Sep 2005" }
  - { court: all_districts, disposition_months: 9.5, trial_months: 22.5, trials_per_judgeship: 19, src: "S FCMS Sep 2005" }
  # del_chancery and ny_commercial: no timing statistics were fetched (dossier); no entry.
