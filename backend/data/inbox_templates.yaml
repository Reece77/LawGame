# Inbox wording (PT-M1b). Ported from backend/data/inbox_templates.yaml @ 02fba2aa (Tech Startup
# Tycoon); changed: Partner Track's hiring templates only, with law-firm wording. The sim emits a template key
# plus parameters; persistence renders the title and body for the player's firm. Parameters
# ending in _cents are shown as money; "{role:a}" adds the indefinite article.
# Every key the engine uses must exist here (a test checks).
templates:
  candidates_arrived:
    title: "{count} candidates for {role}"
    body: "Your {channel} search for {role:a} turned up {count} candidates. They will consider offers for the next {shelf} months."
  summer_programme:
    title: "{count} summer associates arrive for {role}"
    body: "Your summer programme runs from May to July. Interview the summer associates you want; offers go out in August for a start next September."
  offer_accepted:
    title: "{name} accepted your offer"
    body: "{name} joins as {level:a} {role} on {salary_cents} a year."
  campus_offer_accepted:
    title: "{name} accepted a place in the class of {class_year}"
    body: "{name} will start as a first-year {role} in {start_label}, on the scale's salary for that year."
  offer_declined:
    title: "{name} declined your offer"
    body: "{name} has turned down the {role} role and is no longer a candidate."
  class_started:
    title: "{name} starts today"
    body: "{name} joins the firm as a first-year {role} on {salary_cents} a year."
  resigned:
    title: "{name} has resigned"
    body: "{name} has handed in their notice and will leave at the start of next month."
  laid_off: # PT-M10: the firm let someone go
    title: "{name} has been let go"
    body: "{name} leaves at the start of next month with {severance_cents} of severance."
  employee_left:
    title: "{name} has left"
    body: "{name} has left the firm ({reason})."
  tag_revealed:
    title: "You noticed something about {name}"
    body: "You have noticed that {name} {reveal_text}."
  retained: # PT-M6: a counter-offer kept someone who had resigned (TST 23.3)
    title: "{name} is staying"
    body: "{name} has withdrawn their notice and is staying at the firm."
  bonuses_paid:
    title: "Year-end bonuses: {total_cents}"
    body: "The firm paid {count} year-end bonuses, {total_cents} in all, {policy} the market."
  # PT-M3a: clients and matters
  matter_opened:
    title: "New matter: {matter}"
    body: "The client has instructed the firm on {matter}, with expected fees of {fees_cents} at standard rates. The practice has staffed it by the default rule; change the team on the matter's page."
  matter_conflicted:
    title: "Conflict on {matter}"
    body: "The conflicts check found {matter} adverse to a current client, {affected}. Seek a waiver this month or the instruction is declined."
  matter_declined:
    title: "Declined: {matter}"
    body: "The firm declined {matter} for a conflict of interest."
  matter_closed:
    title: "{matter}: {result}"
    body: "{matter} has ended ({result})."
  settlement_offer:
    title: "Settlement offer on {matter}"
    body: "The other side offers {offer_cents} to settle {matter}. The offer is open until the end of next month."
  deadline_missed:
    title: "Deadline missed on {matter}"
    body: "The team on {matter} missed a deadline: the matter was under-staffed for its pace. The client has noticed."
  matter_disqualified:
    title: "Disqualified from {matter}"
    body: "A conflict that was never checked has surfaced: the firm is disqualified from {matter}, and both clients are unhappy."
  waiver_granted:
    title: "{client} waived the conflict"
    body: "{client} gave a waiver, and {matter} is open."
  waiver_refused:
    title: "{client} refused a waiver"
    body: "{client} would not waive the conflict; {matter} is declined."
  rates_rose: # PT-M7a
    title: "The rate card moves {pct}"
    body: "January's rate review moved the firm's standard rates {pct}. The card now stands at {index} times 2005's; clients compare it with the market's."
  case_assessed: # PT-M7a: early case assessment (spec 7.6)
    title: "Case assessment: {matter}"
    body: "{name} assessed the merits of {matter}: {merits}."
  pro_bono_opened: # PT-M7a (spec 7.8)
    title: "Pro bono: {matter}"
    body: "The firm has taken on {matter} pro bono. It needs about {hours} hours over {months} months, with no fees."
  introduction_made:
    title: "{name} introduced to {client}"
    body: "{client} now instructs the firm in {practice}."
  introduction_failed:
    title: "{client} passed on {name}"
    body: "{client} did not take up the introduction in {practice}."
  # PT-M3b: billing and collections
  bill_disputed:
    title: "{client} disputes a bill"
    body: "{client} disputes {amount_cents} of a {bill_cents} bill. Concede, negotiate or hold firm on the Finance screen; unanswered, the billing team negotiates when the dispute's window closes."
  padding_found:
    title: "Padded time found on a bill to {client}"
    body: "A dispute has brought to light {amount_cents} of time on a bill to {client} that was never worked. The firm has credited it, and the client is not pleased."
  client_bankrupt:
    title: "{client} has filed for bankruptcy"
    body: "{client} has filed for bankruptcy. Its unpaid bills, {lost_cents} in all, have been written off as bad debts."
  client_failed: # PT-M7: a real client history fails (clients.yaml fails)
    title: "{client} has filed for Chapter 11"
    body: "{client} has filed for bankruptcy. Our work for it has stopped and its unpaid bills will be written off as bad debts; its estate will instruct restructuring counsel."
  client_rescued:
    title: "{client} has been rescued"
    body: "{client} has been sold in a rescue. Its bills will be paid, but its legal work will move to the buyer's firms within months."
  # PT-M5: rival firms, panels and RFPs
  rfp_open:
    title: "{client} invites pitches: {kind}"
    body: "{client} has opened a {kind} covering {practices}. Pitch from the Market screen with a team and your claims before the award in two months."
  rfp_won:
    title: "{client} picks the firm"
    body: "{client} has chosen the firm in its RFP."
  rfp_lost:
    title: "{client} goes elsewhere"
    body: "{client} has chosen other firms in its RFP."
  rival_approach:
    title: "{firm} is courting {name}"
    body: "{firm} has offered {name} {offer_cents} a year to move. Counter on the Market screen this month, or {name} answers next month."
  rival_poached:
    title: "{name} is leaving for {firm}"
    body: "{name} has accepted {firm}'s offer and has given notice."
  rival_approach_declined:
    title: "{name} turns down {firm}"
    body: "{name} has declined {firm}'s approach and is staying."
  rival_joined:
    title: "{name} joins {firm}"
    body: "{name}'s notice is over: they are now at {firm}."
  # PT-M4: the partnership
  profit_allocated:
    title: "The year's profit is allocated: {profit_cents}"
    body: "{profit_cents} of profit has been allocated to {partners} equity partners. Their true-ups are paid from January to April as cash allows."
  covenant_breach:
    title: "Covenant breach: {covenant}"
    body: "The bank's {covenant} covenant is breached. Cure it within {months} months or the bank will call the revolver."
  revolver_called:
    title: "The bank has called the revolver"
    body: "The bank has called the revolver ({drawn_cents} drawn). It must be repaid within {months} months."
  revolver_default:
    title: "The firm cannot repay the bank"
    body: "The called revolver is past due ({drawn_cents} outstanding). {months} more month ends in default and the bank forces the firm to dissolve."
  cfo_warning:
    title: "The finance team warns: {covenant}"
    body: "The {covenant} covenant is close to its limit or breached, with {drawn_cents} drawn on the revolver. Consider stopping guarantees and draws, a capital call, or repaying the bank."
  cfo_forecast:
    title: "The finance team's forecast: {covenant} in {months} months"
    body: "On the last months' trend of fees, cash and borrowing, the {covenant} covenant breaks in about {months} months, with {drawn_cents} drawn on the revolver by then. There is time to act: slow guarantees and hiring, suspend draws, call capital or repay the bank."
  insolvent:
    title: "The firm is out of cash"
    body: "Cash is {cash_cents} after the revolver. {months} more month ends like this and the firm dissolves."
  firm_dissolved:
    title: "The firm has dissolved"
    body: "The partnership could not pay its debts and has dissolved. The game is over."
  stage_reached:
    title: "The firm reaches stage {stage}"
    body: "With its growth the firm has reached a new stage."
  vote_result:
    title: "Vote {result}: {title}"
    body: "The partnership voted on {title}: {yes} for, {no} against. The motion {result}."
  partner_admitted:
    title: "{name} is made up"
    body: "{name} joins the partnership as {track} partner from January."
  partner_deequitised:
    title: "{name} is de-equitised"
    body: "{name} moves to income partner. Their capital and current account are repaid over three years. Other partners have noticed."
  told_to_move_on:
    title: "{name} was not made up"
    body: "{name} was not admitted this year and has been told to move on. They will leave within the year unless made counsel."
  moved_on:
    title: "{name} moves on"
    body: "{name} has left for {destination}."
  partner_approached:
    title: "{suitor} approaches {name}"
    body: "{suitor} has offered {name} {offer_cents} a year, with {years} years guaranteed. Counter on the Partnership screen before the end of next month."
  partner_stayed:
    title: "{name} stays"
    body: "{name} has turned down {suitor} and stays with the firm."
  partner_leaving:
    title: "{name} is leaving for {destination}"
    body: "{name} has resigned from the partnership for {destination}. {clients} of their clients are expected to follow over the coming months; their capital is repaid over three years."
  client_followed:
    title: "{client} follows {name}"
    body: "{client} has moved its work to follow {name}."
  lateral_candidates:
    title: "{count} lateral partners for {practice}"
    body: "The recruiter has found {count} partners open to a move. Their books are shown as ranges until diligence."
  lateral_declined:
    title: "{name} declined your offer"
    body: "{name} has decided not to join."
  lateral_joined:
    title: "{name} joins as partner"
    body: "{name} joins the partnership on {comp_cents} a year, guaranteed for {years} years. Their clients will follow over the next one to two years."
  client_arrived:
    title: "{client} follows {name} to the firm"
    body: "{client} has instructed the firm, following {name}."
  partners_dissolve:
    title: "The partners vote to dissolve"
    body: "With the firm out of money and most partners restless, the partnership has voted to dissolve. The game is over."
  mp_term_set:
    title: "The managing partner's term"
    body: "As the firm grows, the agreement now sets a {years}-year term for the managing partner, after which the partners elect one."
  mp_unopposed:
    title: "Re-elected unopposed"
    body: "No partner stood against you: you begin a new term as managing partner."
  election_won:
    title: "You are re-elected managing partner"
    body: "The partners re-elected you over {rival}."
  election_lost:
    title: "You lost the election to {rival}"
    body: "{rival} is the new managing partner. Stay on as a partner (your practice and your votes) and stand again at the next term's end, or hand over to a partner and play them."
  election_lost_again:
    title: "{rival} keeps the managing partnership"
    body: "The partners kept {rival} as managing partner."
  # --- PT-M8: seats, authority, pitches and reports ------------------------------------------
  seat_appointed:
    title: "{name} takes the {seat} seat"
    body: "{name} is now the firm's {seat}. Set their authority and guardrails on the Org screen's Leadership panel."
  seat_vacated:
    title: "The {seat} seat is vacant"
    body: "Nobody holds the {seat} seat. A vacant seat from its stage counts against the firm until it is filled."
  pitch:
    title: "{name} pitches: {what}"
    body: "{detail}"
  pitch_answered:
    title: "Pitch {outcome}: {what}"
    body: "{detail}"
  pitch_lapsed:
    title: "Pitch lapsed: {what}"
    body: "{name}'s pitch was not answered by the next quarter and lapses."
  pitch_scored:
    title: "Pitch follow-through: {what} was a {outcome}"
    body: "{name}'s pitch from {made_label}: the central case was {central}; it measured {measured}."
  partners_meeting:
    title: "Partners' meeting: the committee is {mood}"
    body: "{detail}"
  exco_term:
    title: "The exco_elected term {result}"
    body: "{detail}"
  exco_elected:
    title: "The partners elect the executive committee"
    body: "Elected for the year: {names}."
  # PT-M17: the founder's life, family and succession
  foundation_created:
    title: "{name} is founded"
    body: "Your foundation's cause is {cause}. Give to it from your personal account; each December it grants 5% of its endowment."
  foundation_grants:
    title: "{name} granted {amount_cents}"
    body: "This year's grants went to {cause}. They count toward your legacy and the profession has noticed."
  bar_office_won:
    title: "You were elected bar president"
    body: "The bar association elected you its president. Your influence grows while you serve, and the term counts toward your legacy."
  bar_office_lost:
    title: "You lost the bar election"
    body: "The bar association chose another candidate. Build your influence on its committees and stand again next year."
  annuity_granted:
    title: "{name} retires with an annuity"
    body: "{name} retires with {monthly_cents} a month for {years} years, booked to retired-partner annuities and paid from the firm's cash."
  annuity_vote:
    title: "The annuity vote {result}"
    body: "The partners voted on retired partners' annuities: {yes} for, {no} against."
  succession_due_retirement:
    title: "You reach the retirement age"
    body: "At {age} the partnership agreement retires you. Name a successor within {months} months, or your succession plan's (or the strongest partner) will be put to the vote."
  succession_due_health:
    title: "Your doctors advise you to step back"
    body: "At {age} your health asks you to hand over. Name a successor within {months} months, or your succession plan's (or the strongest partner) will be put to the vote."
  succession_elected:
    title: "The partners elected {name}"
    body: "{name} was elected managing partner: {yes} for, {no} against."
  succession_lost:
    title: "The partners did not elect {name}"
    body: "{rival} won the partnership's support instead ({yes} for your candidate, {no} against)."
  succession_handover:
    title: "{name} is the managing partner"
    body: "{founder} has handed over to {name}. From now on you play {name}; {founder} stays on as senior partner and adviser until retirement."
  adviser_opinion:
    title: "{name} would {stance} {subject}"
    body: "\"{text}\""
  family_divorce:
    title: "Your marriage has ended"
    body: "Your partner has left, with half of your personal savings and investments."
  family_milestone:
    title: "{name} turns {age}"
    body: "A milestone for {name}. School is chosen at 12 and law school at 18; at 25 a qualified child may join the firm."
  family_partner_met:
    title: "You met {name}"
    body: "Time with your family keeps the relationship strong."
  family_married:
    title: "You married"
    body: "Congratulations. Family time keeps the relationship strong; burnout strains it."
  family_child_born:
    title: "{name} is born"
    body: "Your family has grown."
  family_joined_firm:
    title: "{name} joins the firm"
    body: "{name} starts as a first-year associate. The partners will watch how fast they rise."
  # PT-M16: rankings and the legal press (spec 12.2-12.3)
  tables_published:
    title: "The {year} tables are out: the firm is {place} by revenue"
    body: "The legal press's revenue and profit-per-partner tables for {year}: the firm is {place} by revenue and {pep_place} by profit per partner. {leader} leads on {revenue}. The top: {top}."
  league_tables:
    title: "League tables, {quarter}: {best}"
    body: "This quarter's deal league tables place the firm {places}. A top-ten place lifts its reputation in the practice."
  places_published:
    title: "Best places to work {year}: the firm is {place}"
    body: "The associates' survey (morale, hours, pay and training) is out: the firm is {place}. The top: {top}. A top-ten place helps campus recruiting for a year."
  directory_bands:
    title: "The {year} directory bands: {bands}"
    body: "October's directory ranks the firm {bands}, with {people} of its partners named individually. The firm submitted {submitted} a March submission. Bands raise clients' appeal and associate recruiting for the year."
  submission_made:
    title: "Directory submission made ({strength})"
    body: "The firm's submission showcases {matters} matters and names {referees} referees; each referee spent a little of the relationship. Its strength counts toward October's bands."
  press_moment:
    title: "The press wants a word: {about}"
    body: "The legal press is asking about {about} ({detail}). Answer bold, measured or deflect on the Press screen this month, or the press office gives a measured answer."
  claim_made:
    title: "On the record: you said you will {claim}"
    body: "The press will check this claim at its deadline. Keeping it lifts the firm's reputation and your credibility; breaking it costs both."
  claim_kept:
    title: "Claim kept: {claim}"
    body: "You said you would {claim}, and the firm did. Reputation and credibility rise."
  claim_broken:
    title: "Claim broken: {claim}"
    body: "You said you would {claim}. The press noticed: reputation and credibility fall, and expect to hear about it again."
  # PT-M9: automation (spec 9.4; TST 40)
  area_given:
    title: "{name} now runs {area}"
    body: "{name} runs {area} from this month, within {limit_cents} a decision. Their decisions appear in your monthly digest; one-offs and anything at or above the limit come to you."
  area_returned:
    title: "{area} is back with you"
    body: "{name} can no longer run {area} (they left or lost their seat). You run it again until you give it to someone."
  auto_proposal:
    title: "{name} proposes: {what}"
    body: "{recommendation} It comes to you because {why} ({area}; commits {commitment_cents}). Approve or decline on the Automation screen."
  auto_proposal_expired:
    title: "Proposal expired: {what}"
    body: "{name}'s proposal was not answered in time and lapses as declined."
  auto_proposal_answered:
    title: "Proposal {outcome}: {what}"
    body: "{name}'s proposal: {outcome}."
  automation_digest:
    title: "Your month: {month}"
    body: "{summary}"
  # PT-M11: offices, admissions and the UK path
  office_opened:
    title: "New office in {city}"
    body: "The firm signed a lease in {city} for {seats} lawyer seats at {rent_cents} a month. Its clients' work now reaches the firm there."
  office_closed:
    title: "The {city} office closes"
    body: "The lease in {city} is broken and its people move to the home office."
  bar_admitted:
    title: "{name} is admitted in {jurisdiction}"
    body: "{name} may now lead matters in {jurisdiction}."
  bar_failed:
    title: "{name} did not pass in {jurisdiction}"
    body: "{name} was not admitted in {jurisdiction} this time. They can sit again."
  training_contracts:
    title: "{count} training contracts offered"
    body: "{count} trainees will join the office in September {year}, two years ahead as the London market recruits."
  trainees_joined:
    title: "{count} trainees join"
    body: "{count} trainee solicitors begin their first six-month seats."
  trainee_qualified:
    title: "{name} qualifies as a solicitor"
    body: "{name} qualifies into {practice} as a newly qualified solicitor."

