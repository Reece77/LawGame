# Practice areas (spec section 6). v1's ten practices; every lawyer holds a familiarity 1-20 for
# each (ADR PT-0006 section 2). Append-only: familiarity draws follow this order (ADR-0013).
#
# PT-M3a adds the market: the New York demand base, rate cards, norms, matter kinds, flow
# share, conflict density and cross-sell affinities. Source tags follow docs/research/v1-market.md:
#   [S] sourced (seen in the cited source), [D] derived from [S] figures (arithmetic shown),
#   [A] assumed (a reasoned estimate; basis given), [spec] the spec section 6 table's default.
# "dossier sN" means docs/research/v1-market.md section N. Money is integer cents in 2005 USD.
#
# Demand: one region in v1, the New York home market. The ten practices carry $12.35bn of the
# $14.0bn NY large-firm market (dossier s3-s4 [D/A]); the other 12% ($1.65bn: arbitration, tax,
# antitrust and the rest) is unserved until PT-M12 adds those practices (dossier s4 review).

# Level -> rate band (dossier s5: junior = 1st-2nd year, mid = 3rd-5th, senior = 6th-8th).
# Business-services levels bill nothing.
rate_bands:
  paralegal: paralegal
  trainee: junior
  associate_1: junior
  associate_2: junior
  associate_3: mid
  associate_4: mid
  associate_5: mid
  associate_6: senior
  associate_7: senior
  associate_8: senior
  senior_associate: senior
  counsel: counsel
  income_partner: partner
  equity_partner: partner

# Firm-wide 2005 rate card, top NY firm, cents an hour (dossier s5 "Derived 2005 rate card"):
# back-cast from the NLJ 2013 NY averages (partners $882, associates $520 [S]) by 1.42 [D/A],
# times a 1.10-1.15 elite premium [A]. Each practice's card below scales the medians by its
# partner median / $700 [D].
rate_card:
  partner: { low: 52500, median: 70000, high: 95000 } # [D/A] s5; $1,000 a 2005 outlier [S]
  counsel: { low: 47500, median: 57500, high: 70000 } # [A] s5: about 80% of partner median
  senior: { low: 45000, median: 50000, high: 57500 } # [A] s5: about 1.35 x associate average
  mid: { low: 35000, median: 41000, high: 47500 } # [A] s5
  junior: { low: 22500, median: 26500, high: 31000 } # [A] s5: about 0.7 x associate average
  paralegal: { low: 14000, median: 18500, high: 24000 } # [A] s5: from memory, not verified

# Other 2005 norms (dossier s7; spec 6). Reference values for KPIs and balance targets.
norms_2005:
  revenue_per_lawyer_cents: 73000000 # [D] s2: Am Law 100 $51.2bn / 70,161 lawyers
  pep_cents: 106000000 # [S] s7: Am Law 100 average profit per equity partner (Adam Smith, Esq.)
  realisation_bp: 9000 # [A] s7: pre-2008 roughly 90%+; spec 6's 85-95%
  collection_bp: 9500 # [A] spec 6: 93-98%; 2013 all-in anchor 83.5% [S]
  leverage: [3.0, 5.0] # [A] s7: elite NY lockstep firms, associates per partner
  billable_target_hours: [1950, 2100] # [A] s7: commonly cited NY norm, not verified
  associate_attrition_bp: [1800, 2000] # [A] s7: boom years, NALP not reached

# Tasks (ADR PT-0011 section 1). `level` is the band the task suits (0 paralegal, 1 junior,
# 2 mid, 3 senior/counsel, 4 partner): people do tasks within one band of their own, and hours
# at or one above their band are substantive (learn(h), ADR PT-0006 section 4). `skills` weigh
# effective skill on the task. `ai_exposure` (0-1, by 2030) is data for v2's eras. All [A].
tasks:
  - { key: review, level: 0, ai_exposure: 0.9, skills: { research: 0.4, legal_reasoning: 0.2, technology: 0.2, project_management: 0.2 } }
  - { key: diligence, level: 1, ai_exposure: 0.7, skills: { research: 0.35, commercial_awareness: 0.25, writing: 0.2, numeracy: 0.2 } }
  - { key: research, level: 1, ai_exposure: 0.7, skills: { research: 0.5, legal_reasoning: 0.3, writing: 0.2 } }
  - { key: drafting, level: 2, ai_exposure: 0.5, skills: { writing: 0.5, legal_reasoning: 0.25, deal_structuring: 0.25 } }
  - { key: management, level: 3, ai_exposure: 0.3, skills: { project_management: 0.5, supervision: 0.3, client_care: 0.2 } }
  - { key: negotiation, level: 3, ai_exposure: 0.1, skills: { negotiation: 0.5, deal_structuring: 0.25, commercial_awareness: 0.25 } }
  - { key: advocacy, level: 4, ai_exposure: 0.1, skills: { advocacy: 0.6, legal_reasoning: 0.25, procedure: 0.15 } }
  - { key: advice, level: 4, ai_exposure: 0.3, skills: { legal_reasoning: 0.4, commercial_awareness: 0.3, client_care: 0.3 } }

# Matter kinds (spec 7.5): phases in order, each a share of the matter's hours and a task mix.
# `outcome`: case (p_win, spec 7.6), deal (p_close), quality (advisory and filings). All [A].
kinds:
  deal:
    outcome: deal
    phases:
      - { key: diligence, share: 0.30, tasks: { diligence: 0.7, review: 0.2, management: 0.1 } }
      - { key: negotiation, share: 0.30, tasks: { drafting: 0.5, negotiation: 0.4, advice: 0.1 } }
      - { key: signing, share: 0.20, tasks: { drafting: 0.4, negotiation: 0.4, management: 0.2 } }
      - { key: regulatory, share: 0.10, tasks: { advice: 0.5, drafting: 0.3, management: 0.2 } }
      - { key: closing, share: 0.10, tasks: { management: 0.5, drafting: 0.3, review: 0.2 } }
  case:
    outcome: case
    phases:
      - { key: pleadings, share: 0.15, tasks: { research: 0.3, drafting: 0.5, advice: 0.2 } }
      - { key: discovery, share: 0.40, tasks: { review: 0.6, research: 0.2, management: 0.2 } }
      - { key: motions, share: 0.20, tasks: { research: 0.3, drafting: 0.4, advocacy: 0.3 } }
      - { key: trial, share: 0.25, tasks: { advocacy: 0.6, research: 0.2, management: 0.2 } }
  investigation:
    outcome: case # resolution: declination or a favourable settlement counts as a win
    phases:
      - { key: review, share: 0.45, tasks: { review: 0.6, research: 0.2, management: 0.2 } }
      - { key: interviews, share: 0.30, tasks: { advice: 0.4, research: 0.3, drafting: 0.3 } }
      - { key: resolution, share: 0.25, tasks: { advocacy: 0.5, negotiation: 0.3, advice: 0.2 } }
  restructuring:
    outcome: deal # a confirmed plan or a signed workout closes
    phases:
      - { key: analysis, share: 0.30, tasks: { diligence: 0.4, advice: 0.4, management: 0.2 } }
      - { key: negotiation, share: 0.40, tasks: { negotiation: 0.5, drafting: 0.3, advice: 0.2 } }
      - { key: confirmation, share: 0.30, tasks: { advocacy: 0.4, drafting: 0.3, management: 0.3 } }
  advisory:
    outcome: quality
    phases:
      - { key: advice, share: 1.0, tasks: { advice: 0.5, research: 0.3, drafting: 0.2 } }
  filing:
    outcome: quality
    phases:
      - { key: preparation, share: 0.5, tasks: { drafting: 0.5, research: 0.3, review: 0.2 } }
      - { key: prosecution, share: 0.5, tasks: { drafting: 0.4, advice: 0.3, management: 0.3 } }

# Flow work's task mix (ADR PT-0004 section 2): routine advice and small matters.
flow_tasks: { advice: 0.25, research: 0.25, drafting: 0.3, review: 0.2 } # [A]

# Each practice:
#   demand_cents: the NY 2005 annual demand base D0 (dossier s4 central value).
#   driver, beta, index, sigma: spec 6's demand formula. index: the macro_history.yaml series
#     that is the driver (PT-M7). beta: [spec] for M&A 1.4, restructuring -1.2, litigation -0.2;
#     others [A]. A counter-cyclical practice (beta < 0) reads a pro-cyclical index, so the
#     spec's sign holds: restructuring reads `credit` (2005's default rate over the month's),
#     litigation and employment read `cycle` (ADR PT-0014). sigma: monthly LogNormal noise [A].
#   rates: cents an hour by band (dossier s5): partner = the s5 comparison table's dossier-view
#     midpoint [D/A]; other bands = the rate card median x partner / $700 [D], to the nearest $5.
#   leverage, margin_bp: [spec] 6 table. realisation_bp, collection_bp: [A] within spec 6's
#     85-95% and 93-98% (used from PT-M3b).
#   flow_share: share of demand that is routine flow work, never a discrete matter [A].
#   conflict_bp: chance a matter's adverse party is a company in the client universe [A]
#     (spec 6: litigation high, private client low).
#   seasonality: monthly demand multipliers, mean 1 (spec 6: deal closings peak in December) [A].
#   matter_kinds: weight (share of discrete fees), median_cents and sigma (LogNormal size of
#     expected fees), months [min, max] (planned duration), critical_bp (chance of a critical
#     risk: bet-the-company, a public deal, an investigation), forums (case kinds: court weights,
#     courts.yaml). All [A].
#   cross_sell: affinities 0-1 with other practices (spec 6, 7.2) [A].
practices:
  - key: corporate_ma
    label: Corporate and M&A
    short_label: M&A
    demand_cents: 240000000000 # $2.4bn [A] s4 row 1 (range $1.9-3.0bn): US M&A $1.1tn [S]
    driver: M&A volume
    beta: 1.4 # [spec]
    index: ma # PT-M7: macro_history.yaml series (docs/research/v1-macro.md)
    sigma: 0.10
    rates: { partner: 72500, counsel: 59500, senior: 52000, mid: 42500, junior: 27500, paralegal: 19000 } # partner $700-750 [D/A]
    leverage: 4.0
    margin_bp: 4000
    realisation_bp: 9200
    collection_bp: 9600
    flow_share: 0.35
    conflict_bp: 3500 # counterparties are often other companies
    seasonality: [0.98, 0.98, 0.98, 0.98, 0.98, 0.98, 0.98, 0.98, 0.98, 0.98, 0.98, 1.22]
    matter_kinds:
